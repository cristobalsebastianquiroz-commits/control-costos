  "vacuno":["Cocina caliente","Proteínas","Vacuno"],"lomo":["Cocina caliente","Proteínas","Vacuno"],"filete":["Cocina caliente","Proteínas","Vacuno"],"asado":["Cocina caliente","Proteínas","Vacuno"],"osobuco":["Cocina caliente","Proteínas","Vacuno"],"carne":["Cocina caliente","Proteínas","Vacuno"],

/* ════════════════════════════════
   ESTADO
   ════════════════════════════════ */
let DB       = JSON.parse(localStorage.getItem('cc_db')    ||'[]');
let TAXES    = JSON.parse(localStorage.getItem('cc_taxes') ||'null') || JSON.parse(JSON.stringify(TAXES_DEF));
let extraCat = JSON.parse(localStorage.getItem('cc_extra') ||'{}');
let manItems=[], scanItems=[], fProv='', fFecha=todayStr(), step='choose', prevPage=null;

function saveDB()    { localStorage.setItem('cc_db',    JSON.stringify(DB)); }
function saveTaxes() { localStorage.setItem('cc_taxes', JSON.stringify(TAXES)); }
function saveExtra() { localStorage.setItem('cc_extra', JSON.stringify(extraCat)); }
function todayStr()  { return new Date().toISOString().split('T')[0]; }

/* ════════════════════════════════
   HELPERS
   ════════════════════════════════ */
function lookup(name){
  // Normalización agresiva para OCR: quitar ruido típico de facturas
  const k = name.toLowerCase().trim()
    // quitar calibres/tallas: cal 18, cal. 22, t/28, n°3
    .replace(/\b(cal\.?\s*\d+|t\/\d+|n[°º]\s*\d+|talla\s*\d+)\b/g,'')
    // quitar unidades con cantidad: 5kg, 2.5lt, 500gr
    .replace(/\d+[.,]?\d*\s*(kg|kgs|gr?|g\b|lt?s?|cc|ml|un|und|pzas?|piezas?|caja|bolsa)/gi,'')
    // quitar modificadores
    .replace(/\b(grande|chico|mediano|premium|selecto|extra|super|mini|x\d+|sin\s+hueso|s\/h|c\/h|fresc[ao]|congeladx?)\b/gi,'')
    // quitar prefijos numéricos sueltos: "03 pollo" → "pollo"
    .replace(/^\d{1,3}\s+/,'')
    // quitar códigos internos (5+ dígitos solos)
    .replace(/\b\d{5,}\b/g,'')
    // normalizar acentos para comparación
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s{2,}/g,' ').trim();

  // Búsqueda exacta primero (con y sin acento)
  if(CAT[k]) return CAT[k];
  if(extraCat[k]) return extraCat[k];

  // Búsqueda en catálogo normalizando también las keys
  const normKey = ek => ek.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  for(const ek of Object.keys({...CAT,...extraCat})){
    const nk = normKey(ek);
    if(k===nk || k.includes(nk) || nk.includes(k)) return CAT[ek]||extraCat[ek];
  }

  // Búsqueda por palabra clave individual (si el nombre tiene varias palabras)
  const words = k.split(' ').filter(w=>w.length>3);
  for(const w of words){
    for(const ek of Object.keys({...CAT,...extraCat})){
      const nk = normKey(ek);
      if(nk===w || nk.startsWith(w) || w.startsWith(nk)) return CAT[ek]||extraCat[ek];
    }
  }

  return null;
}
function getTax(subcat){
  for(const g of Object.values(TAXES))
    for(const t of g)
      if(t.cats&&t.cats.includes(subcat)) return t;
  return TAXES.general[0];
}
function calcCosts(pu,qty,subcat){
  const tax=getTax(subcat), neto=Math.round(pu*qty);
  const ivaA=Math.round(neto*tax.iva/100), adA=Math.round(neto*tax.ad/100);
  return{neto,ivaAmt:ivaA,adAmt:adA,total:neto+ivaA+adA,tax};
}
function fmt(n)  { return '$'+Math.round(n).toLocaleString('es-CL'); }
function fmtP(n) { return n%1===0?n+'%':n.toFixed(1)+'%'; }
function wk(d)   { const dt=new Date(d),m=new Date(dt); m.setDate(dt.getDate()-dt.getDay()+1); return m.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}); }

   ════════════════════════════════ */
/* ════════════════════════════════════════════════════════
   parseOCRText v2 — Parser inteligente de tablas de factura
   ════════════════════════════════════════════════════════
   Estrategia:
   1. Detecta la zona de productos buscando encabezados de tabla
      (descripción, artículo, ítem, detalle, producto, etc.)
   2. Detecta columnas por posición horizontal de los tokens
   3. La columna de texto más a la IZQUIERDA = descripción
   4. Las columnas numéricas a la derecha = cantidad / precio
   5. Ignora todo lo que esté fuera de la zona de productos
   ════════════════════════════════════════════════════════ */
function parseOCRText(rawText){

  /* ── 1. LIMPIEZA INICIAL ── */
  // Normalizar separadores OCR comunes: | → espacio, O→0 en contexto numérico
  const normalize = s => s
    .replace(/\r/g,'')
    .replace(/\t/g,'  ')
    .replace(/[|¡]/g,' ')
    .replace(/(?<=\d)[oO](?=\d)/g,'0')   // OCR confunde O con 0 entre dígitos
    .replace(/(?<=\d)[lI](?=\d)/g,'1')   // OCR confunde l/I con 1 entre dígitos
    .replace(/\s{2,}/g,' ');

  const text = normalize(rawText);
  const allLines = text.split('\n');

  /* ── 2. PATRONES BASE ── */

  // Encabezados de columna descripción (cualquiera de estos detecta inicio de tabla)
  const HEADER_DESC_RX = /\b(descrip\w*|articul\w*|artículo\w*|item\w*|ítem\w*|detalle\w*|producto\w*|nombre\w*|concepto\w*|mercader\w*|glosa\w*)\b/i;

  // Encabezados de columna cantidad
  const HEADER_QTY_RX  = /\b(cant\w*|qty\w*|unid\w*|bultos?|kilos?|kg\b)\b/i;

  // Encabezados de columna precio
  const HEADER_PRICE_RX = /\b(precio\w*|valor\w*|p\.?\s*unit\w*|p\.?\s*neto\w*|monto\w*|importe\w*)\b/i;

  // Líneas que son DEFINITIVAMENTE ruido (encabezado/pie de documento)
  const NOISE_RX = /^(rut\b|giro\b|direcci|fono|telef|email|@|www\.|n[°ºo]?\s*\d|folio|fecha\b|hora\b|caja\b|vendedor|cajero|turno|subtotal\b|sub[\s-]?total|neto\b|iva\b|exento|total\b|descuento|recargo|vuelto|efectivo|tarjeta|d[eé]bito|cr[eé]dito|propina|gracias|atendido|sucursal|local\b|cod\w*\s*\d|p[aá]gina\b|hoja\b)/i;

  // Números que parecen precios chilenos (100 a 9.999.999)
  const PRICE_TOKEN_RX = /^\$?(\d{1,3}(?:[.,]\d{3})+|\d{4,7})([.,]\d{1,2})?$/;

  // Número pequeño que puede ser cantidad (0.1 a 999)
  const QTY_TOKEN_RX   = /^(\d{1,3})([.,]\d{1,3})?$/;

  /* ── 3. DETECTAR ZONA DE PRODUCTOS ── */
  // Buscar la línea de encabezado de la tabla de productos
  let headerLineIdx = -1;
  let descColPos    = -1;   // posición X aproximada (índice de carácter) de columna descripción
  let qtyColPos     = -1;
  let priceColPos   = -1;

  for(let i=0; i<allLines.length; i++){
    const line = allLines[i];
    const low  = line.toLowerCase();

    if(HEADER_DESC_RX.test(low)){
      headerLineIdx = i;

      // Intentar ubicar columnas por posición de los tokens en el encabezado
      const descM  = low.search(HEADER_DESC_RX);
      const qtyM   = low.search(HEADER_QTY_RX);
      const priceM = low.search(HEADER_PRICE_RX);

      descColPos  = descM  >= 0 ? descM  : 0;
      qtyColPos   = qtyM   >= 0 ? qtyM   : -1;
      priceColPos = priceM >= 0 ? priceM : -1;
      break;
    }
  }

  /* ── 4. DETERMINAR RANGO DE LÍNEAS A PARSEAR ── */
  // Si encontramos encabezado → parsear desde encabezado+1
  // Si no encontramos → intentar con todas las líneas (modo fallback)
  const startLine = headerLineIdx >= 0 ? headerLineIdx + 1 : 0;

  // Detectar fin de tabla: primera línea que tenga palabras clave de total/pie
  const END_RX = /\b(total\b|subtotal\b|sub[\s-]?total\b|neto\b|iva\b|exento\b|suma\b|gran\s*total\b)/i;
  let endLine = allLines.length;
  for(let i=startLine; i<allLines.length; i++){
    if(END_RX.test(allLines[i]) && !/descrip|articul|item|product/i.test(allLines[i])){
      endLine = i;
      break;
    }
  }

  const productLines = allLines.slice(startLine, endLine);

  /* ── 5. EXTRAER TOKENS POR POSICIÓN ── */
  // Para cada línea de producto, separar en tokens con su posición X
  function tokenize(line){
    const tokens = [];
    let match;
    const rx = /\S+/g;
    while((match = rx.exec(line)) !== null){
      tokens.push({ text: match[0], pos: match.index });
    }
    return tokens;
  }

  // Limpiar número: quitar $, puntos de miles, convertir coma decimal
  function parseNum(s){
    return parseFloat(
      s.replace(/\$/g,'')
       .replace(/\./g,'')
       .replace(',','.')
    );
  }

  function isPrice(s){ return PRICE_TOKEN_RX.test(s.replace(/\s/g,'')); }
  function isQty(s)  { return QTY_TOKEN_RX.test(s.replace(/\s/g,'')); }
  function isNoise(line){ return NOISE_RX.test(line.trim()); }

  // Detectar si un token es "solo basura OCR"
  function isGarbage(s){
    return /^[_\-=*#+\\\/]{2,}$/.test(s) || /^[^a-zA-Z0-9áéíóúñÁÉÍÓÚÑ]{3,}$/.test(s);
  }

  /* ── 6. PARSEAR CADA LÍNEA DE PRODUCTO ── */
  const items = [];

  for(const rawLine of productLines){
    const line = rawLine.trim();
    if(!line || line.length < 3) continue;
    if(isNoise(line)) continue;
    if(isGarbage(line)) continue;
    // Saltar líneas que son solo separadores o fechas
    if(/^[-=_]{3,}/.test(line)) continue;
    if(/^\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}/.test(line)) continue;
    // Saltar si la línea completa es solo dígitos/puntos (código de barra, etc)
    if(/^[\d\s.,]+$/.test(line) && line.replace(/[\s.,]/g,'').length > 5) continue;

    const tokens = tokenize(line);
    if(!tokens.length) continue;

    /* Separar tokens en: textuales y numéricos */
    const numTokens  = tokens.filter(t => isPrice(t.text) || (isQty(t.text) && parseNum(t.text) <= 999));
    const textTokens = tokens.filter(t => !isPrice(t.text) && /[a-zA-ZáéíóúñÁÉÍÓÚÑ]/.test(t.text));

    // Si no hay ningún token textual con letras → skip (línea de puros números)
    if(!textTokens.length) continue;

    /* ── Construir nombre desde tokens de texto ── */
    // Si tenemos posición de columna descripción, preferir tokens cercanos a ella
    let nameTokens = textTokens;
    if(descColPos >= 0 && textTokens.length > 1){
      // Ordenar por cercanía a descColPos y tomar los más cercanos
      nameTokens = textTokens.filter(t => t.pos >= descColPos && t.pos < (priceColPos > 0 ? priceColPos : 999));
      if(!nameTokens.length) nameTokens = textTokens;
    }

    let nombre = nameTokens.map(t=>t.text).join(' ')
      // Limpiar artefactos OCR frecuentes
      .replace(/\b(kg|gr?|lt?|cc|un|und|pza|piezas?)\b/gi,' ')
      .replace(/\bx\d+\b/gi,' ')
      .replace(/\b\d{5,}\b/g,' ')      // códigos internos largos
      .replace(/[_=*#+\\]{1,}/g,' ')
      .replace(/\s{2,}/g,' ')
      .trim();

    if(nombre.length < 3) continue;
    if(/^\d+$/.test(nombre)) continue;

    /* ── Extraer cantidad y precio de tokens numéricos ── */
    let qty = 1;
    let pu  = 0;

    // Estrategia: buscar qty al INICIO de línea o cerca de columna qty
    // Buscar precio al FINAL de línea o cerca de columna precio

    // Primer token numérico pequeño (<=999) al inicio = cantidad
    const firstToken = tokens[0];
    if(isQty(firstToken.text) && !isPrice(firstToken.text)){
      const n = parseNum(firstToken.text);
      if(n >= 1 && n <= 500){
        qty = n;
        // Si el segundo token también es numérico y grande → puede ser precio
      }
    }

    // También detectar patrón "Nº cantidad" explícito al inicio del nombre
    const qtyMatch = nombre.match(/^(\d{1,3}(?:[.,]\d{3})?)\s+(.{3,})/);
    if(qtyMatch){
      const candidate = parseNum(qtyMatch[1]);
      if(candidate >= 1 && candidate <= 500 && !isPrice(qtyMatch[1])){
        qty   = candidate;
        nombre = qtyMatch[2].trim();
      }
    }

    // Precios: de todos los tokens que parecen precio, tomar el mayor
    // (el total de línea, que luego dividimos por qty para obtener pu)
    const priceNums = numTokens
      .filter(t => isPrice(t.text))
      .map(t => parseNum(t.text))
      .filter(n => n >= 100 && n <= 9999999);

    if(priceNums.length){
      // Si hay un único precio → es el precio unitario
      // Si hay dos precios y qty>1 → el menor es pu, el mayor es total
      // Si hay dos precios y qty=1 → el mayor es precio con IVA, el menor es neto
      priceNums.sort((a,b)=>a-b);
      if(priceNums.length === 1){
        pu = priceNums[0];
        // Si qty > 1 y pu parece ser total → dividir
        if(qty > 1 && pu / qty > 100 && pu / qty < 5000000){
          // Ambiguo: guardamos pu tal cual; el usuario puede corregir
        }
      } else {
        // Múltiples números: el más chico suele ser pu, el más grande el total línea
        // Pero si son muy similares, es otro escenario
        const min = priceNums[0];
        const max = priceNums[priceNums.length-1];
        if(qty > 1 && Math.abs(max - min*qty) < max*0.05){
          // max ≈ min * qty → min es pu
          pu = min;
        } else {
          // Tomar el segundo-a-último (precio unitario suele estar antes del total)
          pu = priceNums.length >= 2 ? priceNums[priceNums.length-2] : min;
        }
      }
    }

    // Si precio es 0 y hay tokens que parecen precio → skip (no hay info útil)
    if(pu === 0) continue;

    /* ── Limpiar nombre final ── */
    nombre = nombre
      .replace(/^\W+|\W+$/g,'')
      .replace(/\s{2,}/g,' ')
      .trim();

    // Capitalizar correctamente
    nombre = nombre.split(' ').map(w=>{
      if(w.length <= 2) return w.toLowerCase();
      return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
    }).join(' ');

    if(nombre.length < 3) continue;

    /* ── Clasificar ── */
    const found = lookup(nombre);
    const sub2  = found?.[2] || 'General';

    items.push({
      nombre, qty, pu,
      area:  found?.[0] || 'Sin clasificar',
      cat:   found?.[1] || 'Sin clasificar',
      sub2,
      ok:    !!found,
      costs: calcCosts(pu, qty, sub2)
    });
  }

  /* ── 7. DEDUPLICAR ── */
  // Eliminar duplicados por nombre (primeros 10 caracteres normalizados)
  const seen = new Set();
  const deduped = items.filter(it => {
    const k = it.nombre.toLowerCase().replace(/\s/g,'').slice(0,10);
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  });

  /* ── 8. FALLBACK ── */
  // Si el parser inteligente no encontró nada, intentar modo simple
  if(!deduped.length){
    return parseOCRFallback(rawText);
  }

  return deduped;
}

/* ════════════════════════════════════════════════════════
   parseOCRFallback — modo simple línea por línea
   Se usa cuando el parser de tabla no extrae nada
   ════════════════════════════════════════════════════════ */
function parseOCRFallback(text){
  const SKIP = /^(rut|giro|direcci|fono|tel|email|@|neto|iva|total|subtotal|descuento|boleta|factura|ticket|fecha|hora|caja|vendedor|gracias|vuelto|efectivo|tarjeta|debito|crédito|credito|propina|n[°º]\s*\d)/i;
  const items = [];
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>3);

  for(const line of lines){
    if(SKIP.test(line)) continue;
    if(/^\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}/.test(line)) continue;
    if(/^[-=_]{3,}/.test(line)) continue;

    // Extraer precios de la línea
    const priceRx = /\$?\s*(\d{1,3}(?:[.,]\d{3})+|\d{4,7})(?:[.,]\d{1,2})?/g;
    const prices = [];
    let m;
    while((m=priceRx.exec(line))!==null){
      const n = parseInt(m[1].replace(/[.,]/g,''));
      if(n>=200 && n<=9999999) prices.push(n);
    }
    if(!prices.length) continue;

    const pu = prices[prices.length-1];
    let nombre = line
      .replace(/\$?\s*\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})?\s*/g,' ')
      .replace(/\d+\s*(kg|gr?|lt?|cc|un|und)/gi,' ')
      .replace(/[_=*#+|\\]{2,}/g,' ')
      .replace(/\s+/g,' ').trim();

    if(nombre.length < 3 || /^\d+$/.test(nombre)) continue;

    let qty = 1;
    const qm = nombre.match(/^(\d+)\s+(.+)/);
    if(qm && parseInt(qm[1])<=99){ qty=parseInt(qm[1]); nombre=qm[2]; }

    nombre = nombre.replace(/^\W+|\W+$/g,'').trim();
    if(nombre.length < 3) continue;
    nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1).toLowerCase();

    const found = lookup(nombre);
    const sub2  = found?.[2]||'General';
    items.push({ nombre, qty, pu, area:found?.[0]||'Sin clasificar', cat:found?.[1]||'Sin clasificar', sub2, ok:!!found, costs:calcCosts(pu,qty,sub2) });
  }

  const seen = new Set();
  return items.filter(it=>{ const k=it.nombre.toLowerCase().slice(0,8); if(seen.has(k)) return false; seen.add(k); return true; });
}

/* ════════════════════════════════
   NAVEGACIÓN
   ════════════════════════════════ */
const META={
  home:['Resumen','Control de costos'],
  facturas:['Facturas','Todas las entradas'],
  nueva:['Nueva factura','Ingresar compra'],
  reportes:['Reportes','Análisis de gastos'],
  impuestos:['Impuestos','Tasas SII Chile']
};
function go(page,btn){
  prevPage=null;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.bnav').forEach(b=>b.classList.remove('on'));
  document.getElementById('pg-'+page).classList.add('on');
  if(btn)btn.classList.add('on');
  document.getElementById('scroll').scrollTop=0;
  const[t,s]=META[page]||['',''];
  document.getElementById('tb-title').textContent=t;
  document.getElementById('tb-sub').textContent=s;
  document.getElementById('back-btn').style.display='none';
  document.getElementById('tb-act').style.display='none';
  if(page==='home')renderHome();
  else if(page==='facturas')renderFacturas();
  else if(page==='nueva'){step='choose';manItems=[];scanItems=[];fProv='';fFecha=todayStr();renderNueva();}
  else if(page==='reportes')renderReportes();
  else if(page==='impuestos')renderImpuestos();
}
function showBack(from){prevPage=from;document.getElementById('back-btn').style.display='flex';}
function goBack(){if(prevPage){const idx=['home','facturas','nueva','reportes','impuestos'].indexOf(prevPage);go(prevPage,document.querySelectorAll('.bnav')[idx]);prevPage=null;}}

/* ════════════════════════════════
   HOME
   ════════════════════════════════ */
function renderHome(){
  const total=DB.reduce((s,f)=>s+f.totalConImp,0);
  const neto=DB.reduce((s,f)=>s+f.totalNeto,0);
  const impTot=total-neto;
  const now=new Date();
  const week=DB.filter(f=>(now-new Date(f.fecha))<7*864e5).reduce((s,f)=>s+f.totalConImp,0);
  const catT={};
  DB.forEach(f=>f.items.forEach(it=>{const c=it.cat||'Sin cat';catT[c]=(catT[c]||0)+it.costs.total;}));
  const top=Object.entries(catT).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const max=top[0]?.[1]||1;
  document.getElementById('pg-home').innerHTML=`
    <div class="met-row">
      <div class="met"><div class="met-l">Gasto total (c/imp)</div><div class="met-v">${fmt(total)}</div><div class="met-s">Neto: ${fmt(neto)}</div></div>
      <div class="met"><div class="met-l">Esta semana</div><div class="met-v">${fmt(week)}</div></div>
    </div>
    <div class="met-row">
      <div class="met"><div class="met-l">Facturas</div><div class="met-v">${DB.length}</div></div>
      <div class="met"><div class="met-l">Impuestos pagados</div><div class="met-v" style="color:#a32d2d">${fmt(impTot)}</div></div>
    </div>
    <button class="fab" onclick="go('nueva',document.querySelectorAll('.bnav')[2])"><i class="ti ti-plus"></i>Ingresar nueva factura</button>
    <div class="slbl">Top categorías</div>
    <div class="card cp">
      ${top.length?top.map(([c,v])=>`<div class="bar-row"><div class="bar-lbl">${c}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/max*100)}%"></div></div><div class="bar-val">${fmt(v)}</div></div>`).join('')
        :'<div style="text-align:center;padding:20px;font-size:13px;color:#999">Sin datos — ingresa tu primera factura</div>'}
    </div>
    <div class="slbl">Últimas facturas</div>
    <div class="card">
      ${DB.length?DB.slice(-5).reverse().map((f,i)=>`
        <div class="row" onclick="verFactura(${DB.length-1-i},'home')" style="cursor:pointer">
          <div style="width:8px;height:8px;border-radius:50%;background:#1d9e75;flex-shrink:0"></div>
          <div class="row-info"><div class="row-t">${f.prov}</div><div class="row-s">${f.fecha} · ${f.items.length} productos</div></div>
          <div class="row-r"><div class="row-amt">${fmt(f.totalConImp)}</div>${f.totalConImp>f.totalNeto?`<div style="font-size:11px;color:#a32d2d">Neto: ${fmt(f.totalNeto)}</div>`:''}</div>
          <i class="ti ti-chevron-right chev"></i>
        </div>`).join(''):'<div style="text-align:center;padding:24px;font-size:13px;color:#999">Sin facturas aún</div>'}
    </div>`;
}

/* ════════════════════════════════
   FACTURAS
   ════════════════════════════════ */
function renderFacturas(){
  const el=document.getElementById('pg-facturas');
  if(!DB.length){el.innerHTML=`<div class="empty"><i class="ti ti-file-invoice"></i><p>No hay facturas aún</p><button class="fab" onclick="go('nueva',document.querySelectorAll('.bnav')[2])"><i class="ti ti-plus"></i>Ingresar primera</button></div>`;return;}
  el.innerHTML=`<div class="card">${DB.slice().reverse().map((f,ri)=>{const i=DB.length-1-ri;return`
    <div class="row" onclick="verFactura(${i},'facturas')" style="cursor:pointer">
      <div style="width:8px;height:8px;border-radius:50%;background:#1d9e75;flex-shrink:0"></div>
      <div class="row-info"><div class="row-t">${f.prov}</div>
      <div class="row-s">${f.fecha} · ${f.items.length} ítems · <span class="badge ${f.src==='scan'?'bg':'bb'}">${f.src==='scan'?'Escaneado':'Manual'}</span></div></div>
      <div class="row-r"><div class="row-amt">${fmt(f.totalConImp)}</div>${f.totalConImp>f.totalNeto?`<div style="font-size:11px;color:#a32d2d">+${fmt(f.totalConImp-f.totalNeto)} imp.</div>`:''}</div>
      <i class="ti ti-chevron-right chev"></i>
    </div>`;}).join('')}</div>`;
}

function verFactura(i,from){
  const f=DB[i]; showBack(from);
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.getElementById('pg-facturas').classList.add('on');
  document.getElementById('tb-title').textContent=f.prov;
  document.getElementById('tb-sub').textContent=f.fecha;
  const tbact=document.getElementById('tb-act');
  tbact.style.display='block';tbact.textContent='Eliminar';tbact.style.color='#a32d2d';
  tbact.onclick=()=>{if(confirm('¿Eliminar esta factura?')){DB.splice(i,1);saveDB();goBack();}};
  document.getElementById('scroll').scrollTop=0;
  document.getElementById('pg-facturas').innerHTML=`
    <div class="card">
      ${f.items.map(it=>{const c=it.costs;const hasAd=c.adAmt>0;return`
        <div class="res-item">
          <div class="res-name">${it.nombre}</div>
          <div class="res-path">${it.area} → ${it.cat} → ${it.sub2}</div>
          ${hasAd?`<span class="tax-pill">+${fmtP(c.tax.ad)} ${c.tax.tipo}</span>`:`<span class="tax-pill none">IVA 19%</span>`}
          <div class="res-bottom">
            <div style="font-size:12px;color:#999">${it.qty} × ${fmt(it.pu)} neto</div>
            <div style="text-align:right"><div class="res-price">${fmt(c.total)}</div>
            ${hasAd?`<div style="font-size:11px;color:#999">Neto: ${fmt(c.neto)}</div>`:''}</div>
          </div>
        </div>`}).join('')}
      <div class="total-row">
        <div><div class="total-lbl">Total c/impuestos</div>
        ${f.totalConImp>f.totalNeto?`<div style="font-size:11px;color:#999">Neto: ${fmt(f.totalNeto)} · Imp: ${fmt(f.totalConImp-f.totalNeto)}</div>`:''}
        </div><div class="total-v">${fmt(f.totalConImp)}</div>
      </div>
    </div>`;
}

   NUEVA FACTURA
   ════════════════════════════════ */
function renderNueva(){
  document.getElementById('tb-title').textContent='Nueva factura';
  document.getElementById('tb-sub').textContent='Ingresar compra';
  const el=document.getElementById('pg-nueva');

  if(step==='choose'){
    el.innerHTML=`
      <div class="ff"><label>Proveedor *</label><input id="np" placeholder="Ej: La Vega, Mayorista 10..." value="${fProv}" oninput="fProv=this.value"></div>
      <div class="ff"><label>Fecha *</label><input type="date" id="nf" value="${fFecha}" oninput="fFecha=this.value"></div>
      <div class="slbl">¿Cómo ingresas los productos?</div>
      <button class="btn-scan" onclick="doScan('cam')">
        <i class="ti ti-camera"></i>
        <div><div style="font-weight:600">Fotografiar factura</div>
        <div style="font-size:12px">El OCR lee los productos automáticamente</div></div>
      </button>
      <button class="btn-out" onclick="doScan('gal')">
        <i class="ti ti-photo"></i>
        <div><div style="font-weight:500">Subir imagen</div>
        <div style="font-size:12px;color:#888">Desde la galería del dispositivo</div></div>
      </button>
      <button class="btn-out" onclick="startMan()">
        <i class="ti ti-pencil"></i>
        <div><div style="font-weight:500">Ingresar manualmente</div>
        <div style="font-size:12px;color:#888">Producto por producto</div></div>
      </button>`;

  } else if(step==='scanning'){
    el.innerHTML=`
      <div class="ocr-box">
        <i class="ti ti-scan ocr-icon"></i>
        <div class="ocr-msg">Leyendo factura...</div>
        <div class="ocr-sub">El OCR está procesando la imagen</div>
        <div class="ocr-bar-track"><div class="ocr-bar-fill" id="ocr-bar" style="width:0%"></div></div>
        <div class="ocr-pct" id="ocr-pct">0%</div>
      </div>
      <div class="info-box"><i class="ti ti-info-circle" style="font-size:16px;flex-shrink:0"></i>
      <span>Mejor resultado con buena iluminación y la factura bien plana. El proceso tarda 10-20 segundos.</span></div>`;

  } else if(step==='scan-preview'){
    const uncat=scanItems.filter(it=>!it.ok).length;
    const total=scanItems.reduce((s,it)=>s+it.costs.total,0);
    const neto=scanItems.reduce((s,it)=>s+it.costs.neto,0);
    el.innerHTML=`
      ${uncat?`<div class="warn-box"><i class="ti ti-alert-triangle" style="flex-shrink:0"></i>Revisa y corrige los productos antes de guardar. Puedes editar nombre, cantidad y precio.</div>`
        :`<div class="ok-box"><i class="ti ti-check" style="flex-shrink:0;font-size:16px"></i>${scanItems.length} productos detectados y clasificados.</div>`}
      <div class="card" style="margin-bottom:10px" id="scan-list">
        ${renderScanItems()}
        <div class="total-row">
          <div><div class="total-lbl">Total c/impuestos</div>
          <div style="font-size:11px;color:#999">Neto: ${fmt(neto)} · Imp: ${fmt(total-neto)}</div></div>
          <div class="total-v">${fmt(total)}</div>
        </div>
      </div>
      <button class="fab" onclick="guardarScan()"><i class="ti ti-check"></i>Guardar factura</button>
      <button class="btn-out" style="justify-content:center" onclick="step='choose';renderNueva()"><i class="ti ti-arrow-left"></i>Volver y escanear de nuevo</button>`;

  } else if(step==='manual'){
    const tot=manItems.reduce((s,it)=>s+it.costs.total,0);
    const neto=manItems.reduce((s,it)=>s+it.costs.neto,0);
    el.innerHTML=`
      <div class="card cp" style="margin-bottom:10px">
        <div class="ff" style="margin-bottom:8px"><label>Nombre del producto</label>
          <input id="mn" placeholder="Ej: Tomate cherry, Vacuno, Cerveza..." oninput="hintCat()"></div>
        <div id="cat-hint" class="hint" style="color:#0f6e56"></div>
        <div id="tax-hint" class="hint" style="color:#a32d2d;margin-top:-8px"></div>
        <div class="g2" style="margin-bottom:10px">
          <div class="ff" style="margin:0"><label>Cantidad</label><input id="mq" type="number" placeholder="1" min="0.01" step="0.01"></div>
          <div class="ff" style="margin:0"><label>Precio neto</label><input id="mp" type="number" placeholder="0" oninput="hintCat()"></div>
        </div>
        <button class="fab" style="margin:0;height:44px;font-size:14px" onclick="addMan()"><i class="ti ti-plus"></i>Agregar</button>
      </div>
      ${manItems.length?`
        <div class="slbl">Productos (${manItems.length})</div>
        <div class="card cp" style="margin-bottom:10px">
          ${manItems.map((it,i)=>{const hasAd=it.costs.adAmt>0;return`
            <div class="chip"><div>
              <div style="font-weight:500">${it.nombre}</div>
              <div style="font-size:11px;color:#888">${it.cat}${hasAd?` · <span style="color:#a32d2d">+${fmtP(it.costs.tax.ad)}</span>`:''} · ${fmt(it.costs.total)}</div>
            </div><button class="chip-del" onclick="delMan(${i})"><i class="ti ti-x"></i></button></div>`}).join('')}
          <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:0.5px solid #f0f0f0;font-size:13px">
            <span style="color:#666">Total c/imp · Neto: ${fmt(neto)}</span>
            <span style="font-weight:500">${fmt(tot)}</span>
          </div>
        </div>
        <button class="fab" onclick="guardarMan()"><i class="ti ti-check"></i>Guardar factura</button>`:''}`;

  } else if(step==='ocr-debug'){
    // No se detectaron productos — mostrar texto crudo para diagnóstico
    const raw = (window._ocrDebugText||'').slice(0,1200);
    el.innerHTML=`
      <div class="warn-box"><i class="ti ti-alert-triangle" style="flex-shrink:0"></i>
        <div><b>No se detectaron productos automáticamente.</b><br>
        Revisa el texto que leyó el OCR abajo. Si la calidad es mala, intenta con mejor iluminación o ingresa manualmente.</div>
      </div>
      <div class="slbl">Texto detectado por OCR</div>
      <div class="card cp" style="margin-bottom:10px">
        <pre style="font-size:11px;color:#666;white-space:pre-wrap;line-height:1.6;max-height:280px;overflow-y:auto">${raw.replace(/</g,'&lt;')}</pre>
      </div>
      <button class="btn-scan" onclick="step='choose';renderNueva()"><i class="ti ti-camera"></i>Intentar de nuevo</button>
      <button class="btn-out" onclick="step='manual';renderNueva()"><i class="ti ti-pencil"></i>Ingresar manualmente</button>`;

  } else if(step==='ok'){
    el.innerHTML=`<div class="empty">
      <i class="ti ti-circle-check" style="color:#1d9e75"></i>
      <p style="font-weight:500;font-size:16px;color:#1a1a1a">Factura guardada</p>
      <p>Costos e impuestos registrados.</p>
      <button class="fab" style="margin-top:16px" onclick="go('home',document.querySelectorAll('.bnav')[0])"><i class="ti ti-home"></i>Ver resumen</button>
      <button class="btn-out" style="justify-content:center" onclick="step='choose';manItems=[];scanItems=[];renderNueva()"><i class="ti ti-plus"></i>Ingresar otra</button>
    </div>`;
  }
}

function renderScanItems(){
  return scanItems.map((it,i)=>{const c=it.costs;const hasAd=c.adAmt>0;return`
    <div class="edit-item">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1">
          <input class="edit-inp" value="${it.nombre}" placeholder="Nombre" style="font-weight:500;margin-bottom:4px" onchange="updateScan(${i},'nombre',this.value)">
          <div style="font-size:11px;color:#999;margin-bottom:4px">${it.area} → ${it.cat} → ${it.sub2}</div>
          ${hasAd?`<span class="tax-pill">+${fmtP(c.tax.ad)} ${c.tax.tipo}</span>`:`<span class="tax-pill none">IVA 19%</span>`}
        </div>
        <button onclick="delScan(${i})" style="border:none;background:none;color:#bbb;cursor:pointer;font-size:18px;flex-shrink:0"><i class="ti ti-x"></i></button>
      </div>
      <div class="edit-row">
        <input class="edit-inp" type="number" value="${it.qty}" placeholder="Qty" style="max-width:70px" onchange="updateScan(${i},'qty',this.value)">
        <span style="font-size:12px;color:#999;align-self:center">×</span>
        <input class="edit-inp" type="number" value="${it.pu}" placeholder="Precio neto" onchange="updateScan(${i},'pu',this.value)">
        <div style="font-weight:500;font-size:14px;align-self:center;flex-shrink:0">${fmt(c.total)}</div>
      </div>
      ${!it.ok?`<select style="font-size:12px;padding:6px 8px;border-radius:7px;border:0.5px solid #ddd;background:#fff;font-family:inherit;margin-top:6px;width:100%" onchange="reclasificar(${i},this.value)">
        <option value="">Asignar categoría...</option>
        <option>Proteínas</option><option>Verduras</option><option>Frutas</option><option>Lácteos</option>
        <option>Panadería</option><option>Abarrotes</option><option>Bebidas</option><option>Desechables</option><option>Limpieza</option>
      </select>`:''}
    </div>`}).join('');
}

function updateScan(i,field,val){
  if(field==='qty') scanItems[i].qty=parseFloat(val)||1;
  else if(field==='pu') scanItems[i].pu=parseFloat(val)||0;
  else if(field==='nombre'){
    scanItems[i].nombre=val;
    const found=lookup(val);
    if(found){scanItems[i].area=found[0];scanItems[i].cat=found[1];scanItems[i].sub2=found[2];scanItems[i].ok=true;}
  }
  scanItems[i].costs=calcCosts(scanItems[i].pu,scanItems[i].qty,scanItems[i].sub2);
  // Redibujar solo la lista sin perder el foco
  const list=document.getElementById('scan-list');
  if(list) list.innerHTML=renderScanItems()+`<div class="total-row">
    <div><div class="total-lbl">Total c/impuestos</div>
    <div style="font-size:11px;color:#999">Neto: ${fmt(scanItems.reduce((s,it)=>s+it.costs.neto,0))} · Imp: ${fmt(scanItems.reduce((s,it)=>s+it.costs.adAmt+it.costs.ivaAmt,0))}</div></div>
    <div class="total-v">${fmt(scanItems.reduce((s,it)=>s+it.costs.total,0))}</div>
  </div>`;
}
function delScan(i){scanItems.splice(i,1);if(!scanItems.length){step='choose';}renderNueva();}
function reclasificar(i,cat){
  if(!cat)return;
  scanItems[i].cat=cat;scanItems[i].area='Cocina caliente';scanItems[i].sub2=cat;scanItems[i].ok=true;
  extraCat[scanItems[i].nombre.toLowerCase().trim()]=['Cocina caliente',cat,cat];
  scanItems[i].costs=calcCosts(scanItems[i].pu,scanItems[i].qty,cat);
  saveExtra();renderNueva();
}

/* ════════════════════════════════
   OCR con Tesseract
   ════════════════════════════════ */
function chkProv(){
  const p=document.getElementById('np')?.value||fProv;
  if(!p.trim()){alert('Ingresa el nombre del proveedor primero');return false;}
  fProv=p;fFecha=document.getElementById('nf')?.value||fFecha;return true;
}
function doScan(src){
  if(!chkProv())return;
  document.getElementById(src==='cam'?'file-cam':'file-gal').click();
}
function startMan(){if(!chkProv())return;step='manual';renderNueva();}

function onFile(input){
  const file=input.files[0];if(!file)return;
  step='scanning';renderNueva();
  const url=URL.createObjectURL(file);
  Tesseract.recognize(url,'spa',{
    logger: m=>{
      if(m.status==='recognizing text'){
        const pct=Math.round(m.progress*100);
        const bar=document.getElementById('ocr-bar');
        const lbl=document.getElementById('ocr-pct');
        if(bar) bar.style.width=pct+'%';
        if(lbl) lbl.textContent=pct+'%';
      }
    }
  }).then(({data:{text}})=>{
    URL.revokeObjectURL(url);
    // Guardar texto crudo para debug
    window._lastOCRText = text;
    scanItems=parseOCRText(text);
    if(!scanItems.length){
      // Mostrar texto OCR crudo para que el usuario entienda qué leyó
      step='ocr-debug';
      window._ocrDebugText = text;
    } else {
      step='scan-preview';
    }
    renderNueva();
  }).catch(e=>{
    step='choose';renderNueva();
    alert('Error al leer la imagen. Intenta con mejor iluminación o usa ingreso manual.');
  });
  input.value='';
}

function guardarScan(){
  if(!scanItems.length){alert('No hay productos');return;}
  const neto=scanItems.reduce((s,it)=>s+it.costs.neto,0);
  const total=scanItems.reduce((s,it)=>s+it.costs.total,0);
  DB.push({prov:fProv,fecha:fFecha,totalNeto:neto,totalConImp:total,src:'scan',
    items:scanItems.map(it=>({nombre:it.nombre,qty:it.qty,pu:it.pu,area:it.area,cat:it.cat,sub2:it.sub2,costs:it.costs}))});
  saveDB();step='ok';renderNueva();
}

function hintCat(){
  const n=document.getElementById('mn')?.value||'';
  const p=parseFloat(document.getElementById('mp')?.value)||0;
  const found=lookup(n);
  const hc=document.getElementById('cat-hint'),ht=document.getElementById('tax-hint');
  if(!hc||!ht)return;
  if(found){
    const tax=getTax(found[2]);
    hc.innerHTML=`<i class="ti ti-check" style="vertical-align:-2px"></i> ${found[0]} → ${found[1]} → ${found[2]}`;
    if(tax.ad>0&&p>0) ht.innerHTML=`<i class="ti ti-receipt-tax" style="vertical-align:-2px"></i> +${fmtP(tax.ad)} ${tax.tipo} = ${fmt(Math.round(p*tax.ad/100))} extra/unidad`;
    else if(tax.ad>0) ht.innerHTML=`<i class="ti ti-receipt-tax" style="vertical-align:-2px"></i> Impuesto adicional de ${fmtP(tax.ad)}`;
    else ht.innerHTML='';
  }else{
    hc.innerHTML=n.length>2?'<span style="color:#854f0b">No en catálogo — IVA normal</span>':'';
    ht.innerHTML='';
  }
}
function addMan(){
  const n=document.getElementById('mn')?.value.trim();
  const q=parseFloat(document.getElementById('mq')?.value)||1;
  const p=parseFloat(document.getElementById('mp')?.value)||0;
  if(!n){alert('Ingresa el nombre del producto');return;}
  const found=lookup(n);const sub2=found?.[2]||'General';
  manItems.push({nombre:n,qty:q,pu:p,area:found?.[0]||'Sin clasificar',cat:found?.[1]||'Sin clasificar',sub2,costs:calcCosts(p,q,sub2)});
  renderNueva();
}
function delMan(i){manItems.splice(i,1);renderNueva();}
function guardarMan(){
  if(!manItems.length){alert('Agrega al menos un producto');return;}
  const neto=manItems.reduce((s,it)=>s+it.costs.neto,0);
  const total=manItems.reduce((s,it)=>s+it.costs.total,0);
  DB.push({prov:fProv,fecha:fFecha,totalNeto:neto,totalConImp:total,src:'manual',items:[...manItems]});
  saveDB();step='ok';renderNueva();
}

/* ════════════════════════════════
   REPORTES
   ════════════════════════════════ */
function renderReportes(){
  const catT={},areaT={},wkT={},impT={};let totalNeto=0,totalImp=0;
  DB.forEach(f=>{
    const w=wk(f.fecha);wkT[w]=(wkT[w]||0)+f.totalConImp;
    totalNeto+=f.totalNeto;totalImp+=(f.totalConImp-f.totalNeto);
    f.items.forEach(it=>{
      const c=it.cat||'Sin cat',a=it.area||'Sin área';
      catT[c]=(catT[c]||0)+it.costs.total;areaT[a]=(areaT[a]||0)+it.costs.total;
      if(it.costs.adAmt>0){const tk=it.costs.tax.nombre;impT[tk]=(impT[tk]||0)+it.costs.adAmt;}
    });
  });
  const catR=Object.entries(catT).sort((a,b)=>b[1]-a[1]);
  const areaR=Object.entries(areaT).sort((a,b)=>b[1]-a[1]);
  const wkR=Object.entries(wkT).sort((a,b)=>a[0]>b[0]?1:-1).slice(-6);
  const impR=Object.entries(impT).sort((a,b)=>b[1]-a[1]);
  const maxW=Math.max(...wkR.map(r=>r[1]),1),maxC=catR[0]?.[1]||1;
  const totAll=catR.reduce((s,[,v])=>s+v,0)||1;
  document.getElementById('pg-reportes').innerHTML=!DB.length?`<div class="empty"><i class="ti ti-chart-bar"></i><p>Sin datos aún</p></div>`:`
    <div class="met-row">
      <div class="met"><div class="met-l">Costo neto total</div><div class="met-v">${fmt(totalNeto)}</div></div>
      <div class="met"><div class="met-l">Impuestos pagados</div><div class="met-v" style="color:#a32d2d">${fmt(totalImp)}</div>
        <div class="met-s">${totalNeto>0?Math.round(totalImp/totalNeto*100):0}% sobre neto</div></div>
    </div>
    ${impR.length?`<div class="slbl">Impuestos por tipo</div>
    <div class="card">${impR.map(([n,v])=>`<div class="row"><div class="row-info"><div class="row-t">${n}</div></div><div class="row-r" style="color:#a32d2d;font-weight:500">${fmt(v)}</div></div>`).join('')}</div>`:''}
    <div class="slbl">Gasto semanal</div>
    <div class="card cp"><div style="display:flex;align-items:flex-end;gap:6px;height:90px;padding-bottom:8px">
      ${wkR.map(([w,v])=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
        <div style="width:100%;background:#1d9e75;border-radius:4px 4px 0 0;height:${Math.round(v/maxW*70)}px;min-height:4px"></div>
        <div style="font-size:10px;color:#999;text-align:center;line-height:1.2">${w}</div>
      </div>`).join('')}
    </div></div>
    <div class="slbl">Por categoría</div>
    <div class="card cp">${catR.map(([c,v])=>`<div class="bar-row"><div class="bar-lbl">${c}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxC*100)}%"></div></div><div class="bar-val">${fmt(v)}</div></div>`).join('')}</div>
    <div class="slbl">Por área</div>
    <div class="card">${areaR.map(([a,v])=>`<div class="row"><div class="row-info"><div class="row-t">${a}</div></div>
      <div class="row-r"><div class="row-amt">${fmt(v)}</div><div style="font-size:11px;color:#999">${Math.round(v/totAll*100)}%</div></div></div>`).join('')}</div>`;
}

/* ════════════════════════════════
   IMPUESTOS
   ════════════════════════════════ */
function renderImpuestos(){
  const groups=[{key:'general',label:'Generales'},{key:'bebidas',label:'Bebidas y alcohol'},{key:'carnes',label:'Carnes y harinas'}];
  document.getElementById('pg-impuestos').innerHTML=`
    <div class="info-box"><i class="ti ti-info-circle" style="font-size:16px;flex-shrink:0"></i>
    <span>Tasas SII Chile vigentes. Toca para editar. Se aplican desde la próxima factura.</span></div>
    ${groups.map(g=>`<div class="slbl">${g.label}</div><div class="card" id="tc-${g.key}"></div>`).join('')}`;
  groups.forEach(g=>renderTaxGroup(g.key));
}
function renderTaxGroup(gk){
  const el=document.getElementById('tc-'+gk);if(!el)return;
  el.innerHTML=TAXES[gk].map((t,i)=>`
    <div>
      <div class="tax-row-edit" onclick="toggleTax('${gk}',${i})">
        <div class="tax-icon-box" style="background:${t.ic}"><i class="ti ${t.icon}" style="color:${t.icol}"></i></div>
        <div class="row-info"><div class="row-t">${t.nombre}</div><div class="row-s">${t.desc}</div></div>
        <div style="text-align:right;flex-shrink:0;margin-left:8px">
          <div style="font-weight:500;font-size:15px;color:${t.ad>0?'#a32d2d':'#0f6e56'}">${fmtP(t.iva+t.ad)}</div>
          <div style="font-size:11px;color:#999">${t.tipo}</div>
        </div>
        <i class="ti ti-chevron-down chev" id="chev-${gk}-${i}"></i>
      </div>
      <div class="edit-panel" id="ep-${gk}-${i}">
        <div style="font-size:11px;color:#999;margin-bottom:10px"><i class="ti ti-scale" style="vertical-align:-2px"></i> ${t.nota}</div>
        <div class="rate-row"><span class="rate-lbl">IVA base</span>
          <input class="rate-input" type="number" value="${t.iva}" step="0.5" min="0" max="100" onchange="updTax('${gk}',${i},'iva',this.value)">
          <span style="font-size:13px;color:#888;margin-left:4px">%</span></div>
        <div class="rate-row"><span class="rate-lbl">${t.tipo==='anticipado'?'IVA anticipado':'Imp. adicional'}</span>
          <input class="rate-input" type="number" value="${t.ad}" step="0.5" min="0" max="100" onchange="updTax('${gk}',${i},'ad',this.value)">
          <span style="font-size:13px;color:#888;margin-left:4px">%</span></div>
        <div style="background:#fff;border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;font-size:12px;margin-top:4px">
          <span style="color:#666">Carga total</span><span style="font-weight:500" id="tt-${gk}-${i}">${fmtP(t.iva+t.ad)}</span>
        </div>
        <button class="save-mini" onclick="saveTaxes();closeAllTax();alert('✓ Tasas guardadas')">
          <i class="ti ti-check" style="vertical-align:-2px"></i> Guardar cambios</button>
      </div>
    </div>`).join('');
}
function toggleTax(gk,i){
  const ep=document.getElementById(`ep-${gk}-${i}`),ch=document.getElementById(`chev-${gk}-${i}`);
  const open=ep.classList.contains('open');closeAllTax();
  if(!open){ep.classList.add('open');ch.style.transform='rotate(180deg)';}
}
function closeAllTax(){
  document.querySelectorAll('.edit-panel').forEach(p=>p.classList.remove('open'));
  document.querySelectorAll('[id^="chev-"]').forEach(c=>c.style.transform='');
}
function updTax(gk,i,field,val){
  TAXES[gk][i][field]=parseFloat(val)||0;
  const el=document.getElementById(`tt-${gk}-${i}`);
  if(el)el.textContent=fmtP(TAXES[gk][i].iva+TAXES[gk][i].ad);
}

go('home',document.querySelectorAll('.bnav')[0]);
</script>
