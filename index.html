<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f4c35">
<title>CostControl</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --g:#1d9e75;--gl:#dff2eb;--gd:#0d6e50;
  --r:#d93025;--rl:#fce8e6;
  --a:#e37400;--al:#fef3e2;
  --b:#1a73e8;--bl:#e8f0fe;
  --bg:#f5f6f8;--card:#fff;
  --border:#e4e7ec;--border2:#f0f2f5;
  --t1:#111827;--t2:#4b5563;--t3:#9ca3af;--t4:#e5e7eb;
  --sh:0 1px 4px rgba(0,0,0,.07);
  --sh2:0 8px 24px rgba(0,0,0,.12);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
.shell{max-width:480px;margin:0 auto;display:flex;flex-direction:column;height:100dvh}
/* ── Topbar ── */
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:40}
.topbar-left{display:flex;align-items:center;gap:10px}
.back-btn{border:none;background:none;cursor:pointer;color:var(--t2);font-size:22px;padding:2px;display:none;align-items:center}
.tb-title{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.tb-sub{font-size:11px;color:var(--t3);margin-top:1px}
.tb-act{border:none;background:none;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;color:var(--g);padding:6px 8px;border-radius:8px}
/* ── Scroll ── */
.scroll{flex:1;overflow-y:auto;padding:14px 14px 100px;-webkit-overflow-scrolling:touch}
/* ── Bottom nav ── */
.bottomnav{background:#fff;border-top:1px solid var(--border);display:flex;position:sticky;bottom:0;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 7px;cursor:pointer;border:none;background:none;color:var(--t3);font-size:9px;font-weight:600;font-family:inherit;letter-spacing:.3px;transition:color .12s}
.bnav i{font-size:22px}
.bnav.on{color:var(--g)}
/* ── Pages ── */
.page{display:none}.page.on{display:block}
/* ── Buttons ── */
.btn-p{background:var(--g);color:#fff;border:none;border-radius:12px;padding:0 20px;height:50px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit;width:100%;justify-content:center;margin-bottom:10px;box-shadow:0 2px 10px rgba(29,158,117,.28)}
.btn-p:active{background:var(--gd);transform:scale(.98)}
.btn-o{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--t1);font-size:14px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:var(--sh);text-align:left}
.btn-o i{font-size:20px;color:var(--t2);flex-shrink:0}
.btn-o:active{background:var(--bg)}
.btn-scan{width:100%;padding:14px;border-radius:12px;border:2px solid var(--g);background:var(--gl);color:var(--gd);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.btn-scan i{font-size:22px;flex-shrink:0}
/* ── Cards ── */
.card{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:10px;box-shadow:var(--sh)}
.cp{padding:14px}
/* ── Labels ── */
.slbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.9px;margin:18px 0 8px}
/* ── Metrics ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.met{background:#fff;border-radius:12px;border:1px solid var(--border);padding:13px 14px;box-shadow:var(--sh)}
.met-l{font-size:11px;color:var(--t2);margin-bottom:4px;font-weight:600}
.met-v{font-size:21px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.met-s{font-size:11px;color:var(--t3);margin-top:3px}
/* ── Row list ── */
.row{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border2);gap:10px}
.row:last-child{border-bottom:none}
.row-info{flex:1;min-width:0}
.row-t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:11px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{text-align:right;flex-shrink:0}
.row-amt{font-size:14px;font-weight:700}
.chev{font-size:16px;color:var(--t4);flex-shrink:0}
/* ── Forms ── */
.ff{margin-bottom:12px}
.ff label{font-size:12px;color:var(--t2);display:block;margin-bottom:5px;font-weight:600}
.ff input,.ff select{width:100%;font-size:15px;padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--t1);font-family:inherit;-webkit-appearance:none}
.ff input:focus,.ff select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(29,158,117,.1)}
/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.bg{background:var(--gl);color:var(--gd)}
.ba{background:var(--al);color:var(--a)}
.bb{background:var(--bl);color:var(--b)}
.br{background:var(--rl);color:var(--r)}
/* ── Info boxes ── */
.ibox{border-radius:10px;padding:11px 13px;font-size:12px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.ibox.blue{background:var(--bl);color:var(--b)}
.ibox.green{background:var(--gl);color:var(--gd)}
.ibox.orange{background:var(--al);color:var(--a)}
.ibox.red{background:var(--rl);color:var(--r)}
/* ── Empty ── */
.empty{text-align:center;padding:44px 20px}
.empty i{font-size:50px;color:var(--t4);display:block;margin-bottom:14px}
.empty-t{font-size:16px;font-weight:700;margin-bottom:6px}
.empty-s{font-size:13px;color:var(--t3);line-height:1.5;margin-bottom:20px}
/* ── Bar chart ── */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.bar-lbl{width:96px;flex-shrink:0;font-size:12px;color:var(--t2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:8px;background:var(--border2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.bar-val{width:72px;text-align:right;flex-shrink:0;font-weight:700;font-size:12px}
/* ── Seg control ── */
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:12px;border:1px solid var(--border)}
.seg-btn{flex:1;padding:8px 4px;border:none;background:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--t3);transition:all .12s}
.seg-btn.on{background:#fff;color:var(--t1);box-shadow:var(--sh)}
/* ── Total row ── */
.total-row{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-top:1px solid var(--border2);background:var(--bg)}
.total-lbl{font-size:13px;color:var(--t2);font-weight:500}
.total-v{font-size:22px;font-weight:800}
/* ── Catálogo item ── */
.citem{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border2);gap:10px;cursor:pointer}
.citem:last-child{border-bottom:none}
.citem:active{background:var(--bg)}
.cicon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.cinfo{flex:1;min-width:0}
.cname{font-size:14px;font-weight:600}
.cpath{font-size:11px;color:var(--t3);margin-top:1px}
.calias{font-size:11px;color:var(--b);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── Search ── */
.srap{position:relative;margin-bottom:10px}
.srap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--t3);pointer-events:none}
.sinp{width:100%;font-size:14px;padding:11px 12px 11px 38px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--t1);font-family:inherit;box-shadow:var(--sh)}
.sinp:focus{outline:none;border-color:var(--g)}
/* ── Alias chips ── */
.achip{display:inline-flex;align-items:center;gap:4px;background:var(--bl);color:var(--b);border-radius:6px;font-size:11px;font-weight:600;padding:3px 8px;margin:2px 2px 2px 0}
.achip button{background:none;border:none;color:var(--b);cursor:pointer;padding:0;font-size:14px;opacity:.7;line-height:1}
/* ── Drop results ── */
.drop{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--sh2);margin-top:-6px;margin-bottom:10px;max-height:260px;overflow-y:auto}
.dopt{padding:11px 14px;border-bottom:1px solid var(--border2);cursor:pointer;display:flex;align-items:center;gap:10px}
.dopt:last-child{border-bottom:none}
.dopt:active{background:var(--bg)}
/* ── Producto línea factura ── */
.pline{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh)}
.pline-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pline-name{font-size:14px;font-weight:700}
.pline-path{font-size:11px;color:var(--t3);margin-top:2px}
.pline-inp-row{display:grid;grid-template-columns:80px 1fr auto;gap:6px;margin-top:10px;align-items:end}
.ninp{font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--t1);font-family:inherit;text-align:right;width:100%}
.ninp:focus{outline:none;border-color:var(--g);background:#fff}
.ninp-lbl{font-size:10px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.del-btn{border:none;background:var(--rl);color:var(--r);border-radius:8px;width:34px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;flex-shrink:0;align-self:flex-end}
.tpill{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700;margin-top:6px}
.tp-ok{background:var(--gl);color:var(--gd)}
.tp-ex{background:var(--rl);color:var(--r)}
/* ── OCR progress ── */
.ocr-card{background:#fff;border-radius:14px;border:1px solid var(--border);padding:24px 20px;text-align:center;box-shadow:var(--sh)}
.ocr-icon{font-size:44px;color:var(--g);display:block;margin-bottom:14px}
.ocr-msg{font-size:15px;font-weight:700;margin-bottom:6px}
.ocr-sub{font-size:12px;color:var(--t3);margin-bottom:16px}
.ocr-track{height:6px;background:var(--border2);border-radius:3px;overflow:hidden;margin:0 16px}
.ocr-fill{height:100%;background:var(--g);border-radius:3px;transition:width .3s}
.ocr-pct{font-size:11px;color:var(--t3);margin-top:6px}
/* ── Match chips (resultado OCR) ── */
.match-item{padding:11px 14px;border-bottom:1px solid var(--border2)}
.match-item:last-child{border-bottom:none}
.match-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.match-ocr{font-size:11px;color:var(--t3);margin-top:2px;font-style:italic}
/* ── KPI grande ── */
.kpi-big{border-radius:16px;padding:22px 20px;margin-bottom:10px;text-align:center}
.kpi-big.verde{background:linear-gradient(135deg,#0d6e50,#1d9e75);color:#fff}
.kpi-big.azul{background:linear-gradient(135deg,#1251ab,#1a73e8);color:#fff}
.kpi-big.naranja{background:linear-gradient(135deg,#b84d00,#e37400);color:#fff}
.kpi-big.rojo{background:linear-gradient(135deg,#9e1a1a,#d93025);color:#fff}
.kpi-val{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.kpi-lbl{font-size:12px;opacity:.85;margin-top:7px;font-weight:600}
.kpi-sub{font-size:11px;opacity:.7;margin-top:4px}
/* ── Chart columns ── */
.chart-cols{display:flex;align-items:flex-end;gap:6px;height:90px;padding-bottom:4px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar{width:100%;border-radius:4px 4px 0 0;min-height:3px}
.chart-lbl{font-size:9px;color:var(--t3);text-align:center;line-height:1.2;word-break:break-all}
/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;padding:20px 16px 40px;box-shadow:0 -8px 40px rgba(0,0,0,.18)}
.mhandle{width:40px;height:4px;background:var(--t4);border-radius:2px;margin:0 auto 18px}
.mtitle{font-size:17px;font-weight:800;margin-bottom:16px;letter-spacing:-.3px}
/* ── Proyección ── */
.prow{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border2)}
.prow:last-child{border-bottom:none}
.plbl{font-size:13px;color:var(--t2)}
.pval{font-size:14px;font-weight:700}
.esc{border-radius:12px;padding:14px;margin-bottom:8px}
.esc.ok{background:var(--gl);border:1px solid #a8dbc7}
.esc.warn{background:var(--al);border:1px solid #f0c98a}
.esc.bad{background:var(--rl);border:1px solid #f0a8a8}
.esc-title{font-size:13px;font-weight:700;margin-bottom:6px}
.esc-row{display:flex;justify-content:space-between;font-size:12px;margin-top:3px;color:var(--t2)}
/* ── Slider ── */
.range{width:100%;margin:8px 0 4px;accent-color:var(--g)}
/* ── Barra triangular (gauge) ── */
.gauge-wrap{padding:12px 0 4px;text-align:center}
.gauge-val{font-size:28px;font-weight:800;letter-spacing:-1px}
.gauge-bar{height:10px;border-radius:5px;background:linear-gradient(to right,var(--r),var(--a),var(--g));margin:8px 0 4px;position:relative}
.gauge-marker{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--t1);transform:translateX(-50%);transition:left .4s ease}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" id="back-btn" onclick="goBack()"><i class="ti ti-arrow-left"></i></button>
      <div>
        <div class="tb-title" id="tb-title">Resumen</div>

<input type="file" id="inp-gal" accept="image/*"                       style="display:none" onchange="onImg(this)">

<script>
/* ══════════════════════════════════════
   PERSISTENCIA
══════════════════════════════════════ */
let CAT  = JSON.parse(localStorage.getItem('cc_cat')  || '[]');
let FAC  = JSON.parse(localStorage.getItem('cc_fac')  || '[]');
let CFG  = JSON.parse(localStorage.getItem('cc_cfg')  || JSON.stringify({
  margen:35, diasMes:26, turnosDia:2, costosF:[]
}));
const sv  = ()=>{ localStorage.setItem('cc_cat', JSON.stringify(CAT)); };
const sf  = ()=>{ localStorage.setItem('cc_fac', JSON.stringify(FAC)); };
const scf = ()=>{ localStorage.setItem('cc_cfg', JSON.stringify(CFG)); };

/* ══════════════════════════════════════
   IMPUESTOS SII CHILE
══════════════════════════════════════ */
const IMP = {
  'iva':       {n:'IVA 19%',            iva:19, ad:0   },
  'iva_azucar':{n:'Beb. alto azúcar',   iva:19, ad:18  },
  'iva_beban': {n:'Beb. analcohólica',  iva:19, ad:10  },
  'iva_vino':  {n:'Vino / cerveza',     iva:19, ad:20.5},
  'iva_licor': {n:'Licores destilados', iva:19, ad:31.5},
  'iva_vacuno':{n:'Vacuno (anticipado)',iva:19, ad:5   },
  'iva_harina':{n:'Harina trigo',       iva:19, ad:12  },
};
function calcImp(nu, qty, k){
  const t=IMP[k]||IMP['iva'], neto=Math.round(nu*qty);
  const iva=Math.round(neto*t.iva/100), ad=Math.round(neto*t.ad/100);
  return {neto, iva, ad, total:neto+iva+ad, tasa:t.iva+t.ad, t};
}

/* ══════════════════════════════════════
   HELPERS
══════════════════════════════════════ */
const fmt   = n => '$'+Math.round(n).toLocaleString('es-CL');
const fmtP  = n => n%1===0?n+'%':n.toFixed(1)+'%';
const today = ()=>new Date().toISOString().split('T')[0];
const curM  = ()=>today().slice(0,7);
const mName = s => new Date(s+'-02').toLocaleDateString('es-CL',{month:'short',year:'2-digit'});
const AREA_COLORS={'Cocina caliente':'#1d9e75','Pastelería':'#e37400','Barra':'#1a73e8','Bodega general':'#7c3aed','Desayuno':'#e8a020','Limpieza':'#0d9e9e','Desechables':'#888'};
const aColor = a => AREA_COLORS[a]||'#555';
const aIcon  = a => ({'Cocina caliente':'ti-tools-kitchen-2','Pastelería':'ti-croissant','Barra':'ti-beer','Bodega general':'ti-box','Desayuno':'ti-coffee','Limpieza':'ti-wash','Desechables':'ti-trash'})[a]||'ti-category';

/* ── Normalización de texto para matching ── */
function norm(s){
  return (s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\b(kg|kgs|gr?|lt?s?|cc|ml|un|und|pza|caja|cj|bol|paq|tarro|pack|x\d+|\d+x\d+|\d+pfx\d+|lat-?\d+|\d+cc|\d{4,})\b/gi,' ')
    .replace(/\s+/g,' ').trim();
}
function matchScore(alias, query){
  const a=norm(alias), q=norm(query);
  if(!a||!q) return 0;
  if(a===q) return 100;
  if(q.includes(a)||a.includes(q)) return 85;
  const aw=a.split(' '), qw=q.split(' ');
  const common=aw.filter(w=>w.length>2&&qw.some(qww=>qww.includes(w)||w.includes(qww)));
  if(common.length/Math.max(aw.length,qw.length)>0.6) return 70;
  return 0;
}
function findBest(query){
  // Busca en catálogo: nombre + aliases. Devuelve [{prod, score, matchedAlias}]
  const results=[];
  for(const p of CAT){
    const candidates=[p.nombre, ...(p.aliases||[])];
    let best=0, bestAlias='';
    for(const c of candidates){
      const s=matchScore(c, query);
      if(s>best){best=s;bestAlias=c;}
    }
    if(best>=70) results.push({prod:p, score:best, alias:bestAlias});
  }
  return results.sort((a,b)=>b.score-a.score);
}

/* ══════════════════════════════════════
   NAVEGACIÓN
══════════════════════════════════════ */
let prevPage=null;
const TITLES={
  home:['Resumen','Control de costos'],
  catalogo:['Catálogo de productos','Mis productos registrados'],
  factura:['Nueva factura','Escanear o ingresar'],
  analisis:['Análisis de costos','Por familia · Tendencia'],
  proyeccion:['Proyección financiera','Punto de equilibrio · Ticket'],
};
function go(page,btn){
  prevPage=null;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.bnav').forEach(b=>b.classList.remove('on'));
  document.getElementById('pg-'+page).classList.add('on');
  if(btn) btn.classList.add('on');
  document.getElementById('scroll').scrollTop=0;
  const[t,s]=TITLES[page];
  document.getElementById('tb-title').textContent=t;
  document.getElementById('tb-sub').textContent=s;
  document.getElementById('back-btn').style.display='none';
  document.getElementById('tb-act').style.display='none';
  if(page==='home')       renderHome();
  else if(page==='catalogo')   renderCatalogo();
  else if(page==='factura')    renderFactura();
  else if(page==='analisis')   renderAnalisis();
  else if(page==='proyeccion') renderProy();
}
function goBack(){
  if(!prevPage) return;
  const idx=['home','catalogo','factura','analisis','proyeccion'].indexOf(prevPage);
  go(prevPage, document.querySelectorAll('.bnav')[idx]);
  prevPage=null;
}
function openModal(html){ document.getElementById('modal-body').innerHTML=html; document.getElementById('ov').style.display='flex'; }
function closeModal(e){ if(e&&e.target!==document.getElementById('ov'))return; document.getElementById('ov').style.display='none'; }
function closeM(){ document.getElementById('ov').style.display='none'; }

/* ══════════════════════════════════════
   HOME
══════════════════════════════════════ */
function renderHome(){
  const m=curM();
  const fMes=FAC.filter(f=>f.fecha.startsWith(m));
  const tMes=fMes.reduce((s,f)=>s+f.totalConImp,0);
  const nMes=fMes.reduce((s,f)=>s+f.totalNeto,0);
  const iMes=tMes-nMes;
  // Mes anterior
  const prev=new Date(); prev.setMonth(prev.getMonth()-1);
  const pm=prev.toISOString().slice(0,7);
  const tAnt=FAC.filter(f=>f.fecha.startsWith(pm)).reduce((s,f)=>s+f.totalConImp,0);
  const vari=tAnt>0?Math.round((tMes-tAnt)/tAnt*100):null;
  // Por familia este mes
  const byArea={};
  fMes.forEach(f=>f.items.forEach(it=>{const a=it.area||'?';byArea[a]=(byArea[a]||0)+it.totalConImp;}));
  const topA=Object.entries(byArea).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxA=topA[0]?.[1]||1;
  // CF configurados
  const cf=CFG.costosF||[];
  const totalCF=cf.reduce((s,c)=>s+c.monto,0);
  // PE rápido
  const peM=totalCF>0?Math.round(totalCF/(CFG.margen/100)):0;
  const pctPE=peM>0?Math.min(Math.round(tMes/peM*100),999):null;

  document.getElementById('pg-home').innerHTML=`
    ${CAT.length===0?`<div class="ibox orange"><i class="ti ti-alert-triangle" style="font-size:16px;flex-shrink:0"></i>
      <span>Empieza creando tu <b>catálogo de productos</b> — ve a la pestaña Catálogo.</span></div>`:''}

    <div class="grid2">
      <div class="met">
        <div class="met-l">Costo del mes</div>
        <div class="met-v">${fmt(tMes)}</div>
        <div class="met-s">${vari!==null?(vari>0?'▲':'▼')+Math.abs(vari)+'% vs. mes ant.':'Sin comparación aún'}</div>
      </div>
      <div class="met">
        <div class="met-l">Impuestos</div>
        <div class="met-v" style="color:var(--r)">${fmt(iMes)}</div>
        <div class="met-s">Neto: ${fmt(nMes)}</div>
      </div>
    </div>
    ${peM>0?`
    <div class="met" style="margin-bottom:10px">
      <div class="met-l">Avance vs. punto de equilibrio</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
        <div style="flex:1;height:10px;background:var(--border2);border-radius:5px;overflow:hidden">
          <div style="width:${Math.min(100,pctPE||0)}%;height:100%;background:${(pctPE||0)<60?'var(--g)':(pctPE||0)<90?'var(--a)':'var(--r)'};border-radius:5px;transition:width .5s"></div>
        </div>
        <span style="font-size:13px;font-weight:700;color:${(pctPE||0)<60?'var(--g)':(pctPE||0)<90?'var(--a)':'var(--r)'}">${pctPE||0}%</span>
      </div>
      <div style="font-size:11px;color:var(--t3);margin-top:4px">Costo acumulado ${fmt(tMes)} de ${fmt(peM)} presupuestado</div>
    </div>`:''}

    <button class="btn-p" onclick="go('factura',document.querySelectorAll('.bnav')[2])">
      <i class="ti ti-scan"></i>Ingresar nueva factura
    </button>

    ${topA.length?`
    <div class="slbl">Gasto por familia este mes</div>
    <div class="card cp">
      ${topA.map(([a,v])=>`
        <div class="bar-row">
          <div class="bar-lbl">${a}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxA*100)}%;background:${aColor(a)}"></div></div>
          <div class="bar-val">${fmt(v)}</div>
        </div>`).join('')}
    </div>`:''}

    <div class="slbl">Últimas facturas</div>
    <div class="card">
      ${FAC.length?FAC.slice().reverse().slice(0,6).map((f,ri)=>{
        const i=FAC.length-1-ri;
        return`<div class="row" onclick="verFac(${i})" style="cursor:pointer">
          <div style="width:8px;height:8px;border-radius:50%;background:var(--g);flex-shrink:0"></div>
          <div class="row-info">
            <div class="row-t">${f.prov}</div>
            <div class="row-s">${f.fecha} · ${f.items.length} ítem${f.items.length>1?'s':''} · <span class="badge ${f.src==='ocr'?'bg':'bb'}">${f.src==='ocr'?'OCR':'Manual'}</span></div>
          </div>
          <div class="row-r"><div class="row-amt">${fmt(f.totalConImp)}</div></div>
          <i class="ti ti-chevron-right chev"></i>
        </div>`;}).join('')
      :`<div class="empty" style="padding:24px"><i class="ti ti-file-invoice" style="font-size:36px"></i><div class="empty-s">Sin facturas aún</div></div>`}

let catQ='';
function renderCatalogo(){
  const tbact=document.getElementById('tb-act');
  tbact.style.display='block'; tbact.textContent='+ Nuevo'; tbact.onclick=()=>modalProd(null);

  const filtered=CAT.filter(p=>{
    if(!catQ) return true;
    const q=catQ.toLowerCase();
    return p.nombre.toLowerCase().includes(q)||(p.categoria||'').toLowerCase().includes(q)
      ||(p.area||'').toLowerCase().includes(q)||(p.aliases||[]).some(a=>a.toLowerCase().includes(q));
  });

  if(!CAT.length){
    document.getElementById('pg-catalogo').innerHTML=`
      <div class="ibox blue"><i class="ti ti-bulb" style="font-size:16px;flex-shrink:0"></i>
      <span>Agrega cada producto que compras con el <b>nombre exacto como aparece en la factura</b> como alias. El OCR lo reconocerá automáticamente.</span></div>
      <div class="empty">
        <i class="ti ti-books"></i>
        <div class="empty-t">Catálogo vacío</div>
        <div class="empty-s">Registra tus productos una sola vez con nombre, área, categoría, impuesto y los nombres que aparecen en las facturas.</div>
        <button class="btn-p" style="max-width:240px;margin:0 auto" onclick="modalProd(null)">
          <i class="ti ti-plus"></i>Crear primer producto
        </button>
      </div>`;
    return;
  }

  const byArea={};
  filtered.forEach(p=>{const a=p.area||'Sin área';(byArea[a]=byArea[a]||[]).push(p);});

  document.getElementById('pg-catalogo').innerHTML=`
    <div class="srap">
      <i class="ti ti-search"></i>
      <input class="sinp" placeholder="Buscar producto, alias, categoría..." value="${catQ}"
        oninput="catQ=this.value;renderCatalogo()">
    </div>
    <div style="font-size:12px;color:var(--t3);margin-bottom:10px">${CAT.length} productos · ${CAT.reduce((s,p)=>s+(p.aliases||[]).length,0)} aliases</div>
    ${Object.entries(byArea).sort().map(([area,prods])=>`
      <div class="slbl" style="display:flex;align-items:center;gap:6px">
        <i class="ti ${aIcon(area)}" style="color:${aColor(area)};font-size:14px"></i>${area}
      </div>
      <div class="card">
        ${prods.map(p=>`
          <div class="citem" onclick="modalProd('${p.id}')">
            <div class="cicon" style="background:${aColor(p.area)}22">
              <i class="ti ${aIcon(p.area)}" style="color:${aColor(p.area)}"></i>
            </div>
            <div class="cinfo">
              <div class="cname">${p.nombre}</div>
              <div class="cpath">${p.categoria||''}${p.sub?' · '+p.sub:''} · ${IMP[p.imp]?.n||'IVA'}</div>
              ${p.aliases?.length?`<div class="calias">📄 ${p.aliases.join(' · ')}</div>`:'<div class="calias" style="color:var(--a)">⚠ Sin aliases — el OCR no lo reconocerá</div>'}
            </div>
            <i class="ti ti-chevron-right chev"></i>
          </div>`).join('')}
      </div>`).join('')}`;
}

let _tmpAl=[], _editId=null;
function modalProd(id){
  _editId=id; const p=id?CAT.find(x=>x.id===id):null;
  _tmpAl=p?[...(p.aliases||[])]:[];
  openModal(`
    <div class="mtitle">${p?'Editar producto':'Nuevo producto'}</div>
    <div class="ff"><label>Nombre del producto *</label>
      <input id="p-n" placeholder="Ej: Pechuga de pollo" value="${p?p.nombre:''}"></div>
    <div class="grid2">
      <div class="ff"><label>Área *</label>
        <select id="p-a">${['Cocina caliente','Pastelería','Barra','Bodega general','Desayuno','Limpieza','Desechables'].map(a=>`<option${p?.area===a?' selected':''}>${a}</option>`).join('')}</select></div>
      <div class="ff"><label>Categoría</label>
        <input id="p-c" placeholder="Ej: Proteínas" value="${p?p.categoria||'':''}"></div>
    </div>
    <div class="ff"><label>Subcategoría</label>
      <input id="p-s" placeholder="Ej: Pollo" value="${p?p.sub||'':''}"></div>
    <div class="ff"><label>Impuesto SII</label>
      <select id="p-i">${Object.entries(IMP).map(([k,v])=>`<option value="${k}"${p?.imp===k?' selected':''}>${v.n} (${fmtP(v.iva+v.ad)})</option>`).join('')}</select></div>
    <div class="ff">
      <label>Nombres en factura (aliases) *</label>
      <div class="ibox blue" style="margin-bottom:8px"><i class="ti ti-scan" style="font-size:14px;flex-shrink:0"></i>
        <span>El OCR busca estos nombres exactamente. Agrega el texto tal como aparece en la factura, ej: <b>"KEY HIGIENIZANTE 1X5L"</b>, <b>"FILETE DE REINETA CJ 8 KG"</b></span></div>
      <input id="p-al" placeholder="Escribe y presiona Enter..." onkeydown="alKey(event)">
      <div id="p-al-chips" style="margin-top:7px"></div>
    </div>
    <button class="btn-p" onclick="saveProd()"><i class="ti ti-check"></i>${p?'Guardar cambios':'Crear producto'}</button>
    ${p?`<button onclick="delProd('${id}')" style="width:100%;padding:12px;border:1px solid var(--r);background:var(--rl);color:var(--r);border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">
      <i class="ti ti-trash" style="vertical-align:-2px"></i> Eliminar</button>`:''}
  `);
  renderAlChips();
}
function alKey(e){
  if(e.key!=='Enter'&&e.key!==',')return; e.preventDefault();
  const v=e.target.value.trim();
  if(v&&!_tmpAl.includes(v)){_tmpAl.push(v);renderAlChips();e.target.value='';}
}
function renderAlChips(){
  const el=document.getElementById('p-al-chips'); if(!el)return;
  el.innerHTML=_tmpAl.map(a=>`<span class="achip">${a}<button onclick="rmAl('${a.replace(/'/,"\\'")}')">&times;</button></span>`).join('');
}
function rmAl(a){_tmpAl=_tmpAl.filter(x=>x!==a);renderAlChips();}
function saveProd(){
  const n=document.getElementById('p-n')?.value.trim();
  if(!n){alert('El nombre es obligatorio');return;}
  const prod={
    id:_editId||('p'+Date.now()),
    nombre:n,
    area:document.getElementById('p-a')?.value,
    categoria:document.getElementById('p-c')?.value.trim(),
    sub:document.getElementById('p-s')?.value.trim(),
    imp:document.getElementById('p-i')?.value||'iva',
    aliases:[..._tmpAl],
  };
  if(_editId){ const i=CAT.findIndex(x=>x.id===_editId); if(i>=0) CAT[i]=prod; }
  else CAT.push(prod);
  sv(); closeM(); renderCatalogo();
}
function delProd(id){
  if(!confirm('¿Eliminar producto del catálogo?'))return;
  CAT=CAT.filter(p=>p.id!==id); sv(); closeM(); renderCatalogo();
}

/* ── Paso 2: OCR ── */
function renderFacScanning(){
  return`
    <div class="ocr-card">
      <i class="ti ti-scan ocr-icon"></i>
      <div class="ocr-msg">Leyendo factura…</div>
      <div class="ocr-sub">Detectando productos del catálogo</div>
      <div class="ocr-track"><div class="ocr-fill" id="ocr-fill" style="width:0%"></div></div>
      <div class="ocr-pct" id="ocr-pct">0%</div>
    </div>
    <div class="ibox blue" style="margin-top:10px"><i class="ti ti-bulb" style="font-size:16px;flex-shrink:0"></i>
    <span>Buena iluminación y factura plana mejoran el resultado. Tarda ~15 segundos.</span></div>`;

function onImg(input){
  const file=input.files[0]; if(!file)return;
  fStep='scanning'; renderFactura();
  const url=URL.createObjectURL(file);
  Tesseract.recognize(url,'spa',{
    logger:m=>{ if(m.status==='recognizing text'){
      const p=Math.round(m.progress*100);
      const f=document.getElementById('ocr-fill'), l=document.getElementById('ocr-pct');
      if(f)f.style.width=p+'%'; if(l)l.textContent=p+'%';
    }}
  }).then(({data:{text}})=>{
    URL.revokeObjectURL(url);
    ocrResults=parseOCRvsCAT(text);
    fStep='review'; renderFactura();
  }).catch(()=>{
    fStep='choose'; renderFactura();
    alert('Error de lectura. Intenta con mejor iluminación o usa ingreso manual.');
  });
  input.value='';
}

/* ── parseOCRvsCAT: extrae líneas de la factura y matchea con catálogo ── */
function parseOCRvsCAT(rawText){
  // 1. Separar texto en líneas limpias
  const SKIP=/^(rut\b|giro\b|direcci|fono|tel[eé]|email|@|www\.|neto\b|iva\b|19\s*%|exento|total\b|descuento|sub[\s-]?total|cancelado|son:|ciento|doscient|trescient|timbre|res\.\s*\d|verifique|s\.i\.i|fecha\s*emis|condicion|vencimiento|iaba|forma\s*de\s*pago|vendedor|ref\b|control|doc\.\s*interno|bultos|peso\s*bruto|n\.p\.g|o\.c\.n)/i;
  const lines=rawText.split('\n')
    .map(l=>l.trim())
    .filter(l=>l.length>4 && !/^\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}/.test(l) && !SKIP.test(l) && !/^[\d\s.,]+$/.test(l));

  // 2. Para cada línea, intentar extraer precio y matchear con catálogo
  const results=[];
  const PRICE_RX=/\$?(\d{1,3}(?:[.,]\d{3})+|\d{4,7})(?:[.,]\d{0,2})?/g;
  const QTY_RX=/^(\d{1,3}(?:[.,]\d{1,3})?)\s/;

  for(const line of lines){
    // Extraer precios
    const prices=[]; let m;
    const tmp=line.replace(PRICE_RX, t=>{ const n=parseInt(t.replace(/\$|\./g,'').replace(',','.')); if(n>=100&&n<=9999999)prices.push(n); return ''; });
    if(!prices.length) continue;

    // Nombre candidato: quitar números grandes y símbolos
    let name=tmp.replace(/[_=*#+|\\]{2,}/g,' ').replace(/\s+/g,' ').trim();
    // Quitar código interno al inicio (6+ alfanum)
    name=name.replace(/^[A-Z0-9]{6,15}\s/,'').replace(/^[0-9]+\s/,'').trim();
    if(name.length<3) continue;

    // Extraer qty del inicio
    let qty=1;
    const qm=name.match(QTY_RX);
    if(qm){qty=parseFloat(qm[1].replace(',','.'))||1; name=name.slice(qm[0].length).trim();}

    // Precio unitario heurística
    const pu=prices.length===1?prices[0]:prices[prices.length-2]||prices[0];

    // Matchear contra catálogo
    const matches=findBest(name);
    if(!matches.length && CAT.length===0) continue; // sin catálogo, skip

    results.push({textoOCR:name, matches, elegido:matches[0]||null, qty, nu:pu, manual:!matches.length});
  }

  // Deduplicar por elegido.prod.id
  const seen=new Set();
  return results.filter(r=>{
    if(!r.elegido) return true; // sin match: siempre incluir para revisión
    const k=r.elegido.prod.id;
    if(seen.has(k))return false; seen.add(k); return true;
  });
}

/* ── Paso 3: revisión OCR ── */
function renderFacReview(){
  const matched=ocrResults.filter(r=>r.elegido);
  const unmatched=ocrResults.filter(r=>!r.elegido);

  return`
    ${matched.length?`
    <div class="ibox green"><i class="ti ti-check" style="font-size:16px;flex-shrink:0"></i>
    <span><b>${matched.length} producto${matched.length>1?'s':''}</b> reconocido${matched.length>1?'s':''} del catálogo. Revisa cantidades y precios.</span></div>`:''}
    ${unmatched.length?`
    <div class="ibox orange"><i class="ti ti-alert-triangle" style="font-size:16px;flex-shrink:0"></i>
    <span><b>${unmatched.length} línea${unmatched.length>1?'s':''}</b> sin match en catálogo. Puedes asignarlas manualmente.</span></div>`:''}
    ${!ocrResults.length?`
    <div class="ibox orange"><i class="ti ti-alert-triangle" style="font-size:16px;flex-shrink:0"></i>
    <span>No se detectaron líneas de productos. Revisa la calidad de la foto o ingresa manualmente.</span></div>`:''}

    ${matched.map((r,i)=>renderReviewLine(r,i)).join('')}
    ${unmatched.map((r,i)=>renderUnmatchedLine(r,matched.length+i)).join('')}

    <div style="height:1px;background:var(--border);margin:14px 0"></div>
    <button class="btn-p" onclick="confirmarOCR()"><i class="ti ti-check"></i>Confirmar y guardar</button>
    <button class="btn-o" style="justify-content:center" onclick="fStep='edit';renderFactura()">
      <i class="ti ti-edit"></i>Editar manualmente</button>
    <button class="btn-o" style="justify-content:center" onclick="fStep='choose';ocrResults=[];renderFactura()">
      <i class="ti ti-camera"></i>Escanear de nuevo</button>`;
}

function renderReviewLine(r,i){
  const p=r.elegido.prod, c=calcImp(r.nu,r.qty,p.imp);
  const t=IMP[p.imp];
  return`
  <div class="pline" id="rl-${i}">
    <div class="pline-top">
      <div>
        <div class="pline-name">${p.nombre}</div>
        <div class="pline-path">${p.area} · ${p.categoria||''}</div>
        <div class="match-ocr">OCR: "${r.textoOCR}"</div>
        <span class="badge bg" style="margin-top:4px">Match ${r.elegido.score}%</span>
        <span class="tpill ${t.ad>0?'tp-ex':'tp-ok'}">${t.n} (${fmtP(t.iva+t.ad)})</span>
      </div>
      <button class="del-btn" onclick="removeOCRLine(${i})"><i class="ti ti-x"></i></button>
    </div>
    <div class="pline-inp-row">
      <div>
        <span class="ninp-lbl">Cantidad</span>
        <input class="ninp" type="number" min="0.001" step="any" value="${r.qty}"
          onchange="ocrResults[${i}].qty=parseFloat(this.value)||1;updOCRLine(${i})">
      </div>
      <div>
        <span class="ninp-lbl">Precio neto unit.</span>
        <input class="ninp" type="number" min="0" value="${r.nu||''}"
          placeholder="0" onchange="ocrResults[${i}].nu=parseFloat(this.value)||0;updOCRLine(${i})">
      </div>
      <div style="text-align:right">
        <span class="ninp-lbl">Total c/imp</span>
        <div id="rl-tot-${i}" style="font-size:15px;font-weight:800;padding-top:7px">${r.nu>0?fmt(c.total):'—'}</div>
      </div>
    </div>
  </div>`;
}

function renderUnmatchedLine(r,i){
  const opts=r.matches.slice(0,5);
  return`
  <div class="pline" id="rl-${i}" style="border-color:var(--a);background:var(--al)">
    <div class="pline-top">
      <div>
        <div class="pline-name" style="color:var(--a)">Sin coincidencia</div>
        <div class="match-ocr" style="color:var(--a)">"${r.textoOCR}"</div>
      </div>
      <button class="del-btn" onclick="removeOCRLine(${i})"><i class="ti ti-x"></i></button>
    </div>
    <div style="margin-top:8px;font-size:12px;color:var(--t2);font-weight:600">Asignar a producto:</div>
    <select style="width:100%;margin-top:6px;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;background:#fff"
      onchange="assignOCRLine(${i},this.value)">
      <option value="">Seleccionar...</option>
      ${opts.map(m=>`<option value="${m.prod.id}">${m.prod.nombre} (${m.score}%)</option>`).join('')}
      ${CAT.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('')}
    </select>
  </div>`;
}

function updOCRLine(i){
  const r=ocrResults[i]; if(!r||!r.elegido)return;
  const c=calcImp(r.nu,r.qty,r.elegido.prod.imp);
  const el=document.getElementById(`rl-tot-${i}`);
  if(el) el.textContent=r.nu>0?fmt(c.total):'—';
}
function removeOCRLine(i){ ocrResults.splice(i,1); renderFactura(); }
function assignOCRLine(i,prodId){
  const p=CAT.find(x=>x.id===prodId); if(!p)return;
  ocrResults[i].elegido={prod:p,score:100,alias:'manual'}; ocrResults[i].manual=false;
  renderFactura();
}

function confirmarOCR(){
  const activos=ocrResults.filter(r=>r.elegido&&r.nu>0);
  if(!activos.length){alert('Agrega al menos un producto con precio');return;}
  fItems=activos.map(r=>{
    const p=r.elegido.prod, c=calcImp(r.nu,r.qty,p.imp);
    return{prodId:p.id,nombre:p.nombre,area:p.area,categoria:p.categoria,sub:p.sub,imp:p.imp,qty:r.qty,nu:r.nu,c};
  });
  guardarFac('ocr');
}

/* ── Paso 4: edición manual ── */
function renderFacEdit(){
  const total=fItems.reduce((s,it)=>s+it.c.total,0);
  const neto =fItems.reduce((s,it)=>s+it.c.neto,0);
  return`
    <div class="card cp" style="margin-bottom:10px">
      <div class="grid2">
        <div class="ff" style="margin:0"><label>Proveedor</label>
          <input id="f-prov2" value="${fProv}" oninput="fProv=this.value"></div>
        <div class="ff" style="margin:0"><label>Fecha</label>
          <input type="date" id="f-fecha2" value="${fFecha}" oninput="fFecha=this.value"></div>
      </div>
    </div>

    <div class="slbl">Buscar producto del catálogo</div>
    <div class="srap">
      <i class="ti ti-search"></i>
      <input class="sinp" id="f-q" placeholder="Buscar en catálogo..." oninput="renderFacDrop(this.value)" autocomplete="off">
    </div>
    <div id="f-drop"></div>

    ${fItems.length?`
      <div class="slbl">Productos agregados (${fItems.length})</div>
      ${fItems.map((it,i)=>renderEditLine(it,i)).join('')}
      <div class="total-row" style="border-radius:12px;border:1px solid var(--border);margin-bottom:10px;background:#fff;box-shadow:var(--sh)">
        <div>
          <div class="total-lbl">Total con impuestos</div>
          <div style="font-size:11px;color:var(--t3)">Neto: ${fmt(neto)} · Imp: ${fmt(total-neto)}</div>
        </div>
        <div class="total-v">${fmt(total)}</div>
      </div>
      <button class="btn-p" onclick="guardarFac('manual')"><i class="ti ti-check"></i>Guardar factura</button>
    `:''}`;
}

function renderFacDrop(q){
  const el=document.getElementById('f-drop');
  if(!q||q.length<2){el.innerHTML='';return;}
  const found=CAT.filter(p=>{
    const s=norm(p.nombre)+' '+(p.aliases||[]).map(norm).join(' ');
    return s.includes(norm(q));
  }).slice(0,8);
  if(!found.length){
    el.innerHTML=`<div class="drop"><div style="padding:12px 14px;font-size:13px;color:var(--t3);text-align:center">
      Sin resultados · <a href="#" onclick="modalProd(null);return false" style="color:var(--g);font-weight:700">Crear producto</a>
    </div></div>`;return;
  }
  el.innerHTML=`<div class="drop">${found.map(p=>`
    <div class="dopt" onclick="addFItem('${p.id}')">
      <div style="width:34px;height:34px;border-radius:9px;background:${aColor(p.area)}22;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="ti ${aIcon(p.area)}" style="color:${aColor(p.area)};font-size:16px"></i>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600">${p.nombre}</div>
        <div style="font-size:11px;color:var(--t3)">${p.area} · ${p.categoria||''} · ${IMP[p.imp]?.n}</div>
      </div>
    </div>`).join('')}</div>`;
}

function addFItem(id){
  const p=CAT.find(x=>x.id===id); if(!p)return;
  const nu=0, qty=1, c=calcImp(nu,qty,p.imp);
  fItems.push({prodId:id,nombre:p.nombre,area:p.area,categoria:p.categoria,sub:p.sub,imp:p.imp,qty,nu,c});
  document.getElementById('f-q').value='';
  document.getElementById('f-drop').innerHTML='';
  renderFactura();
  setTimeout(()=>document.getElementById(`fi-nu-${fItems.length-1}`)?.focus(),100);
}

function renderEditLine(it,i){
  const t=IMP[it.imp]||IMP['iva'];
  return`
  <div class="pline">
    <div class="pline-top">
      <div>
        <div class="pline-name">${it.nombre}</div>
        <div class="pline-path">${it.area} · ${it.categoria||''}</div>
        <span class="tpill ${t.ad>0?'tp-ex':'tp-ok'}">${t.n} (${fmtP(t.iva+t.ad)})</span>
      </div>
      <button class="del-btn" onclick="fItems.splice(${i},1);renderFactura()"><i class="ti ti-x"></i></button>
    </div>
    <div class="pline-inp-row">
      <div>
        <span class="ninp-lbl">Cantidad</span>
        <input class="ninp" type="number" min="0.001" step="any" value="${it.qty||1}"
          onchange="fItems[${i}].qty=parseFloat(this.value)||1;fItems[${i}].c=calcImp(fItems[${i}].nu,fItems[${i}].qty,fItems[${i}].imp);renderFactura()">
      </div>
      <div>
        <span class="ninp-lbl">Precio neto unit.</span>
        <input id="fi-nu-${i}" class="ninp" type="number" min="0" value="${it.nu||''}" placeholder="0"
          onchange="fItems[${i}].nu=parseFloat(this.value)||0;fItems[${i}].c=calcImp(fItems[${i}].nu,fItems[${i}].qty,fItems[${i}].imp);renderFactura()">
      </div>
      <div style="text-align:right">
        <span class="ninp-lbl">Total c/imp</span>
        <div style="font-size:15px;font-weight:800;padding-top:7px">${it.nu>0?fmt(it.c.total):'—'}</div>
      </div>
    </div>
  </div>`;
}

/* ── Guardar ── */
function guardarFac(src){
  if(!fProv.trim()){alert('Ingresa el proveedor');return;}
  if(!fItems.length){alert('Agrega al menos un producto');return;}
  const neto =fItems.reduce((s,it)=>s+it.c.neto,0);
  const total=fItems.reduce((s,it)=>s+it.c.total,0);
  FAC.push({
    id:'f'+Date.now(), prov:fProv, fecha:fFecha, src,
    totalNeto:neto, totalConImp:total,
    items:fItems.map(it=>({
      prodId:it.prodId, nombre:it.nombre, area:it.area,
      categoria:it.categoria||'', imp:it.imp,
      qty:it.qty, nu:it.nu,
      totalNeto:it.c.neto, totalConImp:it.c.total,
      iva:it.c.iva, ad:it.c.ad
    }))
  });
  sf(); fStep='ok'; renderFactura();
}

  </button>`;
}

   ANÁLISIS

let aTab='familias';
function renderAnalisis(){
  const seg=`<div class="seg">
    <button class="seg-btn ${aTab==='familias'?'on':''}" onclick="aTab='familias';renderAnalisis()">Familias</button>
    <button class="seg-btn ${aTab==='tendencia'?'on':''}" onclick="aTab='tendencia';renderAnalisis()">Tendencia</button>
    <button class="seg-btn ${aTab==='productos'?'on':''}" onclick="aTab='productos';renderAnalisis()">Productos</button>
  </div>`;
  if(!FAC.length){
    document.getElementById('pg-analisis').innerHTML=seg+`
      <div class="empty"><i class="ti ti-chart-bar"></i>
      <div class="empty-t">Sin datos</div>
      <div class="empty-s">Ingresa facturas para ver el análisis por familia, tendencia mensual y top de productos.</div></div>`;
    return;
  }
  document.getElementById('pg-analisis').innerHTML=seg+(aTab==='familias'?renderFamilias():aTab==='tendencia'?renderTendencia():renderTopProd());
}

function renderFamilias(){
  const m=curM();
  const fMes=FAC.filter(f=>f.fecha.startsWith(m));
  const byArea={};
  fMes.forEach(f=>f.items.forEach(it=>{
    const a=it.area||'Sin área';
    if(!byArea[a]) byArea[a]={total:0,neto:0,imp:0,cats:{}};
    byArea[a].total+=it.totalConImp; byArea[a].neto+=it.totalNeto; byArea[a].imp+=it.totalConImp-it.totalNeto;
    const c=it.categoria||'General';
    byArea[a].cats[c]=(byArea[a].cats[c]||0)+it.totalConImp;
  }));
  const totalM=Object.values(byArea).reduce((s,v)=>s+v.total,0)||1;
  const sorted=Object.entries(byArea).sort((a,b)=>b[1].total-a[1].total);

  if(!sorted.length) return`<div class="ibox orange"><i class="ti ti-alert-triangle" style="font-size:16px;flex-shrink:0"></i><span>Sin facturas este mes.</span></div>`;

  return`
    <div class="slbl">Este mes · ${fmt(totalM)} total</div>
    <div class="card">
      ${sorted.map(([area,d])=>`
        <div style="padding:13px 14px;border-bottom:1px solid var(--border2)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:12px;height:12px;border-radius:3px;background:${aColor(area)};flex-shrink:0"></div>
              <span style="font-size:14px;font-weight:700">${area}</span>
            </div>
            <div style="text-align:right">
              <div style="font-size:14px;font-weight:800">${fmt(d.total)}</div>
              <div style="font-size:11px;color:var(--t3)">${Math.round(d.total/totalM*100)}% del total</div>
            </div>
          </div>
          <div class="bar-track" style="height:8px;margin-bottom:10px">
            <div class="bar-fill" style="width:${Math.round(d.total/totalM*100)}%;background:${aColor(area)}"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">
            ${Object.entries(d.cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`
              <div style="font-size:12px;color:var(--t2);display:flex;justify-content:space-between;background:var(--bg);padding:5px 8px;border-radius:6px">
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px">${c}</span>
                <span style="font-weight:700;flex-shrink:0;margin-left:4px">${fmt(v)}</span>
              </div>`).join('')}
          </div>
          <div style="display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--t3)">
            <span>Neto: ${fmt(d.neto)}</span>
            <span style="color:var(--r)">Imp: ${fmt(d.imp)}</span>
          </div>
        </div>`).join('')}
    </div>
    <div class="slbl">Acumulado histórico por familia</div>
    <div class="card cp">${renderHistFam()}</div>`;
}

function renderHistFam(){
  const byA={};
  FAC.forEach(f=>f.items.forEach(it=>{const a=it.area||'?'; byA[a]=(byA[a]||0)+it.totalConImp;}));
  const tot=Object.values(byA).reduce((s,v)=>s+v,0)||1;
  return Object.entries(byA).sort((a,b)=>b[1]-a[1]).map(([a,v])=>`
    <div class="bar-row">
      <div class="bar-lbl">${a}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/tot*100)}%;background:${aColor(a)}"></div></div>
      <div class="bar-val">${fmt(v)}</div>
    </div>`).join('');
}

function renderTendencia(){
  const meses={};
  FAC.forEach(f=>{
    const m=f.fecha.slice(0,7);
    if(!meses[m]) meses[m]={total:0,neto:0,imp:0,facs:0};
    meses[m].total+=f.totalConImp; meses[m].neto+=f.totalNeto;
    meses[m].imp+=f.totalConImp-f.totalNeto; meses[m].facs++;
  });
  const sorted=Object.entries(meses).sort((a,b)=>a[0]>b[0]?1:-1).slice(-6);
  const maxV=Math.max(...sorted.map(([,v])=>v.total),1);
  const vari=sorted.map(([,v],i)=>{
    if(!i) return null;
    const p=sorted[i-1][1].total;
    return p>0?Math.round((v.total-p)/p*100):null;
  });

  return`
    <div class="slbl">Evolución mensual</div>
    <div class="card cp">
      <div class="chart-cols">
        ${sorted.map(([m,v],i)=>`
          <div class="chart-col">
            ${vari[i]!==null?`<div style="font-size:9px;font-weight:700;color:${vari[i]>0?'var(--r)':'var(--g)'};text-align:center">${vari[i]>0?'▲':'▼'}${Math.abs(vari[i])}%</div>`:'<div style="font-size:9px;color:transparent">-</div>'}
            <div class="chart-bar" style="height:${Math.round(v.total/maxV*76)}px;background:${m===curM()?'var(--g)':'#b8ddd0'}"></div>
            <div class="chart-lbl">${mName(m)}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="slbl">Detalle por mes</div>
    <div class="card">
      ${sorted.slice().reverse().map(([m,v],i)=>`
        <div class="row">
          <div style="width:38px;height:38px;border-radius:10px;background:${m===curM()?'var(--gl)':'var(--bg)'};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:${m===curM()?'var(--gd)':'var(--t2)'};flex-shrink:0;text-align:center;line-height:1.2">${mName(m)}</div>
          <div class="row-info">
            <div class="row-t">${fmt(v.total)}</div>
            <div class="row-s">Neto ${fmt(v.neto)} · Imp ${fmt(v.imp)} · ${v.facs} factura${v.facs>1?'s':''}</div>
          </div>
          ${vari[sorted.length-1-i]!==null?`<span class="badge ${vari[sorted.length-1-i]>0?'br':'bg'}">${vari[sorted.length-1-i]>0?'▲':'▼'}${Math.abs(vari[sorted.length-1-i])}%</span>`:''}
        </div>`).join('')}
    </div>`;
}

function renderTopProd(){
  const prod={};
  FAC.forEach(f=>f.items.forEach(it=>{
    if(!prod[it.nombre]) prod[it.nombre]={total:0,qty:0,area:it.area,cat:it.categoria,n:0};
    prod[it.nombre].total+=it.totalConImp; prod[it.nombre].qty+=it.qty; prod[it.nombre].n++;
  }));
  const sorted=Object.entries(prod).sort((a,b)=>b[1].total-a[1].total).slice(0,20);
  if(!sorted.length) return`<div class="ibox orange"><i class="ti ti-alert-triangle" style="flex-shrink:0"></i><span>Sin datos.</span></div>`;
  const maxV=sorted[0][1].total;
  return`
    <div class="slbl">Top 20 por costo acumulado</div>
    <div class="card">
      ${sorted.map(([n,d],i)=>`
        <div style="padding:11px 14px;border-bottom:1px solid var(--border2)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
              <div style="font-size:12px;font-weight:800;color:var(--t3);width:20px;flex-shrink:0">${i+1}</div>
              <div style="min-width:0">
                <div style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n}</div>
                <div style="font-size:11px;color:var(--t3)">${d.area} · ${d.n} factura${d.n>1?'s':''}</div>
              </div>
            </div>
            <div style="font-size:14px;font-weight:800;flex-shrink:0">${fmt(d.total)}</div>
          </div>
          <div class="bar-track" style="margin-top:7px;height:5px">
            <div class="bar-fill" style="width:${Math.round(d.total/maxV*100)}%;background:${aColor(d.area)}"></div>
          </div>
        </div>`).join('')}
    </div>`;
}

  document.getElementById('pg-proyeccion').innerHTML=seg+(pTab==='ticket'?renderTicketMin():pTab==='pe'?renderPE():renderProyConfig());
}

/* ── Ticket mínimo por cliente ── */
function renderTicketMin(){
  const m=curM();
  const costoMes=FAC.filter(f=>f.fecha.startsWith(m)).reduce((s,f)=>s+f.totalConImp,0);
  const cf=(CFG.costosF||[]).reduce((s,c)=>s+c.monto,0);
  const margen=(CFG.margen||35)/100;
  const dias=CFG.diasMes||26;
  const turnos=CFG.turnosDia||2;
  const cobT=CFG.coberturasTurno||0;
  const cobDia=cobT*turnos;
  const cobMes=cobDia*dias;

  // Ticket mínimo = Costo total / (clientes * margen_complementario)
  // Si el costo es X y margen bruto es M%, entonces: Ticket = CostoUnit / (1-M%)
  // Costo unitario = costo total / clientes
  const costoTotal=costoMes+cf; // total incluyendo costos fijos

  // Caso 1: sabemos clientes estimados
  const costoUnit=cobMes>0?costoTotal/cobMes:0;
  const ticketMin=costoUnit>0?Math.round(costoUnit/(1-margen)):0;

  // Simulador
  const simCob=window._simCob||cobMes||100;
  const simCU=costoTotal/simCob;
  const simTick=Math.round(simCU/(1-margen));
  const simVenta=Math.round(simTick*simCob);
  const simGan=Math.round(simVenta*margen-cf);

  return`
    ${costoMes===0?`<div class="ibox orange"><i class="ti ti-alert-triangle" style="font-size:16px;flex-shrink:0"></i>
      <span>Sin costos registrados este mes. Ingresa facturas primero.</span></div>`:''}
    ${!cf&&!CFG.costosF?.length?`<div class="ibox blue"><i class="ti ti-bulb" style="font-size:16px;flex-shrink:0"></i>
      <span>Agrega costos fijos (arriendo, sueldos, servicios) en <b>Configurar</b> para una proyección más precisa.</span></div>`:''}

    <div class="grid2" style="margin-bottom:10px">
      <div class="met">
        <div class="met-l">Costo variable mes</div>
        <div class="met-v">${fmt(costoMes)}</div>
        <div class="met-s">Ingredientes e insumos</div>
      </div>
      <div class="met">
        <div class="met-l">Costos fijos mes</div>
        <div class="met-v">${fmt(cf)}</div>
        <div class="met-s">${(CFG.costosF||[]).length} ítems</div>
      </div>
    </div>

    ${ticketMin>0?`
    <div class="kpi-big azul">
      <div class="kpi-val">${fmt(ticketMin)}</div>
      <div class="kpi-lbl">Ticket mínimo por cliente para cubrir costos</div>
      <div class="kpi-sub">${cobMes} clientes/mes · margen ${CFG.margen||35}%</div>
    </div>`:''}

    <div class="slbl">Simulador · ¿Cuánto cobrar según la afluencia?</div>
    <div class="card cp">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;color:var(--t2);font-weight:600">Clientes estimados/mes</span>
        <span style="font-size:16px;font-weight:800" id="sim-cob-val">${simCob}</span>
      </div>
      <input type="range" class="range" id="sim-cob"
        min="10" max="${Math.max(2000,simCob*2)}" step="10" value="${simCob}"
        oninput="window._simCob=parseInt(this.value);document.getElementById('sim-cob-val').textContent=this.value;updSim()">

      <div style="height:1px;background:var(--border2);margin:14px 0"></div>

      <div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid var(--border2)">
        <span style="color:var(--t2)">Costo por cliente</span>
        <span id="s-cu" style="font-weight:700">${fmt(simCU)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid var(--border2)">
        <span style="color:var(--t2)">Ticket mínimo (margen ${CFG.margen||35}%)</span>
        <span id="s-tick" style="font-weight:800;font-size:16px;color:var(--b)">${fmt(simTick)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid var(--border2)">
        <span style="color:var(--t2)">Venta mensual proyectada</span>
        <span id="s-venta" style="font-weight:700">${fmt(simVenta)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px">
        <span style="color:var(--t2)">Resultado estimado</span>
        <span id="s-gan" style="font-weight:800;font-size:16px;color:${simGan>=0?'var(--g)':'var(--r)'}">${simGan>=0?'+':''}${fmt(simGan)}</span>
      </div>
    </div>

    <div class="slbl">Escenarios de ticket</div>
    ${[
      {label:'🟢 Ticket alto',   mult:1.3},
      {label:'🟡 Ticket base',   mult:1.0},
      {label:'🔴 Ticket bajo',   mult:0.8},
    ].map(e=>{
      const tick=Math.round(simTick*e.mult);
      const venta=Math.round(tick*simCob);
      const gan=Math.round(venta*margen-cf);
      return`<div class="esc ${gan>=0?'ok':gan>-cf*0.3?'warn':'bad'}">
        <div class="esc-title">${e.label} · ${fmt(tick)}</div>
        <div class="esc-row"><span>Venta proyectada</span><b>${fmt(venta)}</b></div>
        <div class="esc-row"><span>Margen bruto (${fmtP((CFG.margen||35))})</span><b>${fmt(Math.round(venta*margen))}</b></div>
        <div class="esc-row"><span>Costos fijos</span><b style="color:var(--r)">-${fmt(cf)}</b></div>
        <div class="esc-row" style="margin-top:5px;padding-top:5px;border-top:1px solid rgba(0,0,0,.1)">
          <span style="font-weight:700">Resultado</span>
          <b style="font-size:14px;color:${gan>=0?'var(--gd)':'var(--r)'}">${gan>=0?'+':''}${fmt(gan)}</b>
        </div>
      </div>`;
    }).join('')}`;
}

function updSim(){
  const costoMes=FAC.filter(f=>f.fecha.startsWith(curM())).reduce((s,f)=>s+f.totalConImp,0);
  const cf=(CFG.costosF||[]).reduce((s,c)=>s+c.monto,0);
  const margen=(CFG.margen||35)/100;
  const simCob=window._simCob||100;
  const costoTotal=costoMes+cf;
  const simCU=costoTotal/simCob;
  const simTick=Math.round(simCU/(1-margen));
  const simVenta=Math.round(simTick*simCob);
  const simGan=Math.round(simVenta*margen-cf);
  document.getElementById('s-cu').textContent=fmt(simCU);
  document.getElementById('s-tick').textContent=fmt(simTick);
  document.getElementById('s-venta').textContent=fmt(simVenta);
  const sg=document.getElementById('s-gan');
  sg.textContent=(simGan>=0?'+':'')+fmt(simGan);
  sg.style.color=simGan>=0?'var(--g)':'var(--r)';
}

/* ── Punto de equilibrio ── */
function renderPE(){
  const cf=(CFG.costosF||[]).reduce((s,c)=>s+c.monto,0);
  const margen=(CFG.margen||35)/100;
  const dias=CFG.diasMes||26;
  const turnos=CFG.turnosDia||2;
  const cobT=CFG.coberturasTurno||40;
  if(!cf){
    return`<div class="ibox orange"><i class="ti ti-alert-triangle" style="font-size:16px;flex-shrink:0"></i>
      <span>Agrega costos fijos en <b>Configurar</b> para calcular el punto de equilibrio.</span></div>
      <button class="btn-o" style="justify-content:center" onclick="pTab='config';renderProy()"><i class="ti ti-settings"></i>Ir a configurar</button>`;
  }
  const peVenta =Math.round(cf/margen);
  const peDiario=Math.round(peVenta/dias);
  const peSem   =Math.round(peVenta/4.33);
  const cobMin  =cobT>0?Math.ceil(peDiario/(CFG.ticketRef||8000)):null;
  const cobTurno=cobMin&&turnos>0?Math.ceil(cobMin/turnos):null;

  // Costo mes actual vs PE
  const costoMes=FAC.filter(f=>f.fecha.startsWith(curM())).reduce((s,f)=>s+f.totalConImp,0);
  const avance=costoMes>0&&cf>0?Math.min(Math.round(costoMes/cf*100),999):null;

  return`
    <div class="kpi-big verde">
      <div class="kpi-val">${fmt(peVenta)}</div>
      <div class="kpi-lbl">Venta mínima mensual para no perder dinero</div>
      <div class="kpi-sub">CF ${fmt(cf)} · Margen ${fmtP(CFG.margen||35)}</div>
    </div>
    <div class="grid3">
      <div class="met">
        <div class="met-l" style="font-size:10px">Diario</div>
        <div class="met-v" style="font-size:17px">${fmt(peDiario)}</div>
      </div>
      <div class="met">
        <div class="met-l" style="font-size:10px">Semanal</div>
        <div class="met-v" style="font-size:17px">${fmt(peSem)}</div>
      </div>
      <div class="met">
        <div class="met-l" style="font-size:10px">Por turno</div>
        <div class="met-v" style="font-size:17px">${fmt(Math.round(peDiario/turnos))}</div>
      </div>
    </div>
    ${cobMin!==null?`
    <div class="kpi-big azul">
      <div class="kpi-val">${cobMin}</div>
      <div class="kpi-lbl">Coberturas diarias mínimas</div>
      <div class="kpi-sub">Con ticket ${fmt(CFG.ticketRef||8000)} · ${cobTurno} por turno</div>
    </div>`:''}
    <div class="slbl">Costos fijos configurados</div>
    <div class="card">
      ${(CFG.costosF||[]).map((c,i)=>`
        <div class="row">
          <div style="width:10px;height:10px;border-radius:50%;background:${AREA_COLORS[Object.keys(AREA_COLORS)[i%7]]||'#888'};flex-shrink:0"></div>
          <div class="row-info"><div class="row-t">${c.nombre}</div><div class="row-s">${c.tipo}</div></div>
          <div class="row-amt">${fmt(c.monto)}</div>
        </div>`).join('')}
      <div class="total-row">
        <span class="total-lbl">Total costos fijos</span>
        <span class="total-v">${fmt(cf)}</span>
      </div>
    </div>
    ${avance!==null?`
    <div class="slbl">Costos variables vs costos fijos (mes actual)</div>
    <div class="met">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <div class="met-l">Costo variable acumulado</div>
        <span style="font-size:13px;font-weight:700;color:${avance<80?'var(--g)':avance<100?'var(--a)':'var(--r)'}">${avance}% del CF</span>
      </div>
      <div class="bar-track" style="height:10px">
        <div class="bar-fill" style="width:${Math.min(100,avance)}%;background:${avance<80?'var(--g)':avance<100?'var(--a)':'var(--r)'}"></div>
      </div>
      <div style="font-size:11px;color:var(--t3);margin-top:6px">${fmt(costoMes)} sobre ${fmt(cf)} de costos fijos del mes</div>
    </div>`:''}`;
}

/* ── Configurar ── */
function renderProyConfig(){
  const cf=CFG.costosF||[];
  return`
    <div class="slbl">Parámetros de negocio</div>
    <div class="card cp">
      <div class="grid2">
        <div class="ff"><label>Margen bruto objetivo (%)</label>
          <input type="number" value="${CFG.margen||35}" min="1" max="99"
            onchange="CFG.margen=parseFloat(this.value)||35;scf()"></div>
        <div class="ff"><label>Días hábiles/mes</label>
          <input type="number" value="${CFG.diasMes||26}" min="1" max="31"
            onchange="CFG.diasMes=parseInt(this.value)||26;scf()"></div>
      </div>
      <div class="grid2">
        <div class="ff"><label>Turnos por día</label>
          <input type="number" value="${CFG.turnosDia||2}" min="1" max="5"
            onchange="CFG.turnosDia=parseInt(this.value)||2;scf()"></div>
        <div class="ff"><label>Coberturas/turno</label>
          <input type="number" value="${CFG.coberturasTurno||0}" placeholder="Ej: 40"
            onchange="CFG.coberturasTurno=parseInt(this.value)||0;scf()"></div>
      </div>
      <div class="ff"><label>Ticket referencia ($) — para calcular coberturas mínimas</label>
        <input type="number" value="${CFG.ticketRef||0}" placeholder="Ej: 8500"
          onchange="CFG.ticketRef=parseFloat(this.value)||0;scf()"></div>
    </div>

    <div class="slbl">Costos fijos mensuales</div>
    <div class="ibox blue"><i class="ti ti-info-circle" style="font-size:16px;flex-shrink:0"></i>
    <span>Arriendos, sueldos, servicios básicos, seguros — lo que pagas aunque no vendas.</span></div>
    <div class="card" id="cf-list">
      ${cf.length?cf.map((c,i)=>`
        <div class="row">
          <div class="row-info"><div class="row-t">${c.nombre}</div><div class="row-s">${c.tipo}</div></div>
          <div class="row-amt">${fmt(c.monto)}</div>
          <button onclick="CFG.costosF.splice(${i},1);scf();renderProy()" style="border:none;background:var(--rl);color:var(--r);border-radius:7px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex-shrink:0"><i class="ti ti-x"></i></button>
        </div>`).join('')+`
        <div class="total-row"><span class="total-lbl">Total CF</span>
        <span class="total-v">${fmt(cf.reduce((s,c)=>s+c.monto,0))}</span></div>`
      :'<div style="padding:14px;font-size:13px;color:var(--t3);text-align:center">Sin costos fijos</div>'}
    </div>
    <div class="card cp">
      <div style="font-size:12px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Agregar costo fijo</div>
      <div class="ff"><label>Descripción</label>
        <input id="cf-n" placeholder="Ej: Arriendo local, Sueldo cocinero..."></div>
      <div class="grid2">
        <div class="ff"><label>Monto mensual ($)</label><input type="number" id="cf-m" placeholder="0"></div>
        <div class="ff"><label>Tipo</label>
          <select id="cf-t">
            <option>Personal</option><option>Arriendo</option><option>Servicios básicos</option>
            <option>Marketing</option><option>Contabilidad</option><option>Seguros</option><option>Otro</option>
          </select></div>
      </div>
      <button class="btn-p" style="height:44px;font-size:14px;margin:0" onclick="addCF()">
        <i class="ti ti-plus"></i>Agregar</button>
    </div>`;
}

function addCF(){
  const n=document.getElementById('cf-n')?.value.trim();
  const m=parseFloat(document.getElementById('cf-m')?.value)||0;
  const t=document.getElementById('cf-t')?.value||'Otro';
  if(!n||!m){alert('Completa nombre y monto');return;}
  if(!CFG.costosF) CFG.costosF=[];
  CFG.costosF.push({nombre:n,monto:m,tipo:t});
  scf(); renderProy();
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
go('home', document.querySelectorAll('.bnav')[0]);
</script>
