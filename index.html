<body>
<div class="shell">
  <div class="topbar">

<input type="file" id="file-in" accept="image/*" style="display:none" onchange="onFile(this)">

<script>
/* ── DATOS INICIALES ── */
const TAXES_DEFAULT = {
  general:[{id:'iva',nombre:'IVA general',desc:'Mayoría de productos',icon:'ti-receipt',ic:'#e1f5ee',icol:'#0f6e56',iva:19,ad:0,nota:'Art. 14 DL 825',tipo:'normal',cats:['Verduras','Frutas','Lácteos','Panadería','Abarrotes','Desechables','Limpieza','Proteínas']}],
  bebidas:[
    {id:'beb_bajo',nombre:'Bebidas analcohólicas',desc:'Menos de 15g azúcar / 240ml',icon:'ti-bottle',ic:'#faeeda',icol:'#854f0b',iva:19,ad:10,nota:'Art. 42 a) LIVS',tipo:'adicional',cats:['Aguas','Jugos']},
    {id:'beb_alto',nombre:'Bebidas alto en azúcar',desc:'Más de 15g / 240ml · sello negro',icon:'ti-droplet',ic:'#fcebeb',icol:'#a32d2d',iva:19,ad:18,nota:'Art. 42 a) LIVS',tipo:'adicional',cats:[]},
    {id:'cerveza',nombre:'Vinos, cerveza y sidra',desc:'Bebidas alcohólicas fermentadas',icon:'ti-beer',ic:'#faeeda',icol:'#854f0b',iva:19,ad:20.5,nota:'Art. 42 c) LIVS',tipo:'adicional',cats:['Cervezas','Vinos']},
    {id:'licores',nombre:'Licores y destilados',desc:'Pisco, whisky, aguardiente, vermouth',icon:'ti-glass-full',ic:'#fcebeb',icol:'#a32d2d',iva:19,ad:31.5,nota:'Art. 42 b) LIVS',tipo:'adicional',cats:[]}
  ],
  carnes:[
    {id:'carne_ant',nombre:'Vacuno (IVA anticipado)',desc:'5% adicional sobre venta',icon:'ti-meat',ic:'#fcebeb',icol:'#a32d2d',iva:19,ad:5,nota:'Código 17/18 SII',tipo:'anticipado',cats:['Vacuno']},
    {id:'harina_ant',nombre:'Harina de trigo',desc:'12% IVA anticipado',icon:'ti-bread',ic:'#fcebeb',icol:'#a32d2d',iva:19,ad:12,nota:'Código 18 SII',tipo:'anticipado',cats:['Harinas']},
    {id:'pollo_n',nombre:'Pollo, cerdo, huevos',desc:'IVA normal sin anticipado',icon:'ti-feather',ic:'#e1f5ee',icol:'#0f6e56',iva:19,ad:0,nota:'IVA normal',tipo:'normal',cats:['Pollo','Cerdo','Huevos']},
    {id:'pesca_n',nombre:'Pescado y mariscos',desc:'IVA normal',icon:'ti-fish',ic:'#e1f5ee',icol:'#0f6e56',iva:19,ad:0,nota:'IVA normal',tipo:'normal',cats:['Salmón','Mariscos']}
  ]
};

const CAT_MAP = {
  "palta":["Cocina caliente","Verduras","Paltas"],"aguacate":["Cocina caliente","Verduras","Paltas"],"palta hass":["Cocina caliente","Verduras","Paltas"],
  "tomate":["Cocina caliente","Verduras","Tomates"],"tomate cherry":["Cocina caliente","Verduras","Tomates"],"tomate italiano":["Cocina caliente","Verduras","Tomates"],
  "lechuga":["Cocina caliente","Verduras","Hojas verdes"],"espinaca":["Cocina caliente","Verduras","Hojas verdes"],"rúcula":["Cocina caliente","Verduras","Hojas verdes"],
  "cebolla":["Cocina caliente","Verduras","Cebollas"],"cebolla morada":["Cocina caliente","Verduras","Cebollas"],
  "pimentón":["Cocina caliente","Verduras","Pimentones"],"pimiento":["Cocina caliente","Verduras","Pimentones"],
  "zanahoria":["Cocina caliente","Verduras","Raíces"],"papa":["Cocina caliente","Verduras","Raíces"],"papas":["Cocina caliente","Verduras","Raíces"],
  "zapallo":["Cocina caliente","Verduras","Raíces"],"betarraga":["Cocina caliente","Verduras","Raíces"],
  "pollo":["Cocina caliente","Proteínas","Pollo"],"pechuga":["Cocina caliente","Proteínas","Pollo"],
  "pechuga de pollo":["Cocina caliente","Proteínas","Pollo"],"muslo":["Cocina caliente","Proteínas","Pollo"],"trutro":["Cocina caliente","Proteínas","Pollo"],
  "vacuno":["Cocina caliente","Proteínas","Vacuno"],"lomo":["Cocina caliente","Proteínas","Vacuno"],
  "filete":["Cocina caliente","Proteínas","Vacuno"],"asado":["Cocina caliente","Proteínas","Vacuno"],"osobuco":["Cocina caliente","Proteínas","Vacuno"],
  "salmón":["Cocina caliente","Proteínas","Salmón"],"salmon":["Cocina caliente","Proteínas","Salmón"],"trucha":["Cocina caliente","Proteínas","Salmón"],
  "camarones":["Cocina caliente","Proteínas","Mariscos"],"choritos":["Cocina caliente","Proteínas","Mariscos"],"almejas":["Cocina caliente","Proteínas","Mariscos"],
  "cerdo":["Cocina caliente","Proteínas","Cerdo"],"costilla":["Cocina caliente","Proteínas","Cerdo"],"panceta":["Cocina caliente","Proteínas","Cerdo"],
  "huevo":["Cocina caliente","Proteínas","Huevos"],"huevos":["Cocina caliente","Proteínas","Huevos"],
  "leche":["Pastelería","Lácteos","Leche"],"queso":["Pastelería","Lácteos","Quesos"],"queso fresco":["Pastelería","Lácteos","Quesos"],
  "mantequilla":["Pastelería","Lácteos","Mantequilla"],"crema":["Pastelería","Lácteos","Cremas"],"crema de leche":["Pastelería","Lácteos","Cremas"],
  "yogur":["Desayuno","Lácteos","Yogures"],
  "limón":["Barra","Frutas","Cítricos"],"limon":["Barra","Frutas","Cítricos"],"naranja":["Barra","Frutas","Cítricos"],"pomelo":["Barra","Frutas","Cítricos"],
  "frutillas":["Pastelería","Frutas","Frutas rojas"],"fresas":["Pastelería","Frutas","Frutas rojas"],"frambuesas":["Pastelería","Frutas","Frutas rojas"],
  "piña":["Pastelería","Frutas","Tropicales"],"mango":["Pastelería","Frutas","Tropicales"],"maracuyá":["Pastelería","Frutas","Tropicales"],
  "manzana":["Desayuno","Frutas","Frutas rojas"],"pera":["Desayuno","Frutas","Tropicales"],"plátano":["Desayuno","Frutas","Tropicales"],
  "harina":["Pastelería","Panadería","Harinas"],"harina de trigo":["Pastelería","Panadería","Harinas"],
  "azúcar":["Pastelería","Panadería","Azúcares"],"azucar":["Pastelería","Panadería","Azúcares"],
  "pan":["Desayuno","Panadería","Panes"],"marraqueta":["Desayuno","Panadería","Panes"],"hallulla":["Desayuno","Panadería","Panes"],
  "aceite":["Cocina caliente","Abarrotes","Aceites"],"aceite de oliva":["Cocina caliente","Abarrotes","Aceites"],
  "arroz":["Bodega general","Abarrotes","Granos"],"fideos":["Bodega general","Abarrotes","Pastas"],"pasta":["Bodega general","Abarrotes","Pastas"],
  "sal":["Bodega general","Abarrotes","Condimentos"],"pimienta":["Bodega general","Abarrotes","Condimentos"],"ajo":["Bodega general","Abarrotes","Condimentos"],
  "cerveza":["Barra","Bebidas","Cervezas"],"vino":["Barra","Bebidas","Vinos"],"vino tinto":["Barra","Bebidas","Vinos"],"vino blanco":["Barra","Bebidas","Vinos"],
  "agua":["Barra","Bebidas","Aguas"],"agua mineral":["Barra","Bebidas","Aguas"],
  "jugo":["Barra","Bebidas","Jugos"],"néctar":["Barra","Bebidas","Jugos"],
  "servilletas":["Bodega general","Desechables","Papel"],"vasos":["Bodega general","Desechables","Vasos"],
  "bolsas":["Bodega general","Desechables","Bolsas"],"envases":["Bodega general","Desechables","Envases"],
  "detergente":["Bodega general","Limpieza","Detergentes"],"cloro":["Bodega general","Limpieza","Desinfectantes"],
  "esponja":["Bodega general","Limpieza","Utensilios"],"guantes":["Bodega general","Limpieza","Utensilios"]
};

/* ── ESTADO ── */
let DB       = JSON.parse(localStorage.getItem('cc_db')    || '[]');
let TAXES    = JSON.parse(localStorage.getItem('cc_taxes') || 'null') || JSON.parse(JSON.stringify(TAXES_DEFAULT));
let extraCat = JSON.parse(localStorage.getItem('cc_extra') || '{}');

let imgData=null, manItems=[], iaItems=[], fProv='', fFecha=new Date().toISOString().split('T')[0], step='choose', prevPage=null;

function saveDB()    { localStorage.setItem('cc_db',    JSON.stringify(DB)); }
function saveTaxes() { localStorage.setItem('cc_taxes', JSON.stringify(TAXES)); }
function saveExtra() { localStorage.setItem('cc_extra', JSON.stringify(extraCat)); }

/* ── HELPERS ── */
function lookup(name) {
  const k = name.toLowerCase().trim()
    .replace(/\s*cal\s*\d+/g,'').replace(/\s+\d+\s*(kg|g|lt?|un)/g,'')
    .replace(/\b(grande|chico|mediano|premium|x\d+)\b/g,'').trim();
  if (CAT_MAP[k])    return CAT_MAP[k];
  if (extraCat[k])   return extraCat[k];
  for (const ek of Object.keys({...CAT_MAP,...extraCat})) {
    if (k.includes(ek) || ek.includes(k)) return CAT_MAP[ek] || extraCat[ek];
  }
  return null;
}

function getTax(subcat) {
  for (const g of Object.values(TAXES))
    for (const t of g)
      if (t.cats && t.cats.includes(subcat)) return t;
  return TAXES.general[0];
}

function calcCosts(pu, qty, subcat) {
  const tax  = getTax(subcat);
  const neto = Math.round(pu * qty);
  const ivaA = Math.round(neto * tax.iva / 100);
  const adA  = Math.round(neto * tax.ad  / 100);
  return { neto, ivaAmt:ivaA, adAmt:adA, total:neto+ivaA+adA, tax };
}

function fmt(n)    { return '$' + Math.round(n).toLocaleString('es-CL'); }
function fmtP(n)   { return n % 1 === 0 ? n + '%' : n.toFixed(1) + '%'; }
function wk(d) {
  const dt=new Date(d), m=new Date(dt);
  m.setDate(dt.getDate()-dt.getDay()+1);
  return m.toLocaleDateString('es-CL',{day:'2-digit',month:'short'});
}

/* ── NAVEGACIÓN ── */
const META = {
  home:      ['Resumen','Control de costos'],
  facturas:  ['Facturas','Todas las entradas'],
  nueva:     ['Nueva factura','Ingresar compra'],
  reportes:  ['Reportes','Análisis de gastos'],
  impuestos: ['Impuestos','Tasas SII Chile · Art. 42']
};

function go(page, btn) {
  prevPage = null;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.bnav').forEach(b => b.classList.remove('on'));
  document.getElementById('pg-'+page).classList.add('on');
  if (btn) btn.classList.add('on');
  document.getElementById('scroll').scrollTop = 0;
  const [t,s] = META[page] || ['',''];
  document.getElementById('tb-title').textContent = t;
  document.getElementById('tb-sub').textContent   = s;
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('tb-act').style.display   = 'none';
  if (page==='home')      renderHome();
  else if (page==='facturas')  renderFacturas();
  else if (page==='nueva')     { step='choose'; manItems=[]; iaItems=[]; imgData=null; fProv=''; renderNueva(); }
  else if (page==='reportes')  renderReportes();
  else if (page==='impuestos') renderImpuestos();
}

function showBack(from) {
  prevPage = from;
  document.getElementById('back-btn').style.display = 'flex';
}

function goBack() {
  if (prevPage) {
    const idx = ['home','facturas','nueva','reportes','impuestos'].indexOf(prevPage);
    go(prevPage, document.querySelectorAll('.bnav')[idx]);
    prevPage = null;
  }
}

/* ── HOME ── */
function renderHome() {
  const total   = DB.reduce((s,f) => s+f.totalConImp, 0);
  const neto    = DB.reduce((s,f) => s+f.totalNeto, 0);
  const impTot  = DB.reduce((s,f) => s+(f.totalConImp-f.totalNeto), 0);
  const now     = new Date();
  const week    = DB.filter(f => (now-new Date(f.fecha)) < 7*864e5).reduce((s,f)=>s+f.totalConImp,0);
  const catT    = {};
  DB.forEach(f => f.items.forEach(it => {
    const c = it.cat||'Sin cat'; catT[c] = (catT[c]||0) + it.costs.total;
  }));
  const top = Object.entries(catT).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const max = top[0]?.[1] || 1;
  document.getElementById('pg-home').innerHTML = `

function chkProv() {
  const p = document.getElementById('np')?.value || fProv;
  if (!p.trim()) { alert('Ingresa el nombre del proveedor primero'); return false; }
  fProv  = p;
  fFecha = document.getElementById('nf')?.value || fFecha;
  return true;
}
function startCam() {
  if (!chkProv()) return;
  const f = document.getElementById('file-in');
  f.setAttribute('capture','environment'); f.click();
}
function startGal() {
  if (!chkProv()) return;
  const f = document.getElementById('file-in');
  f.removeAttribute('capture'); f.click();
}
function startMan() {
  if (!chkProv()) return;
  step = 'manual'; renderNueva();
}

function onFile(input) {
  const file = input.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => { imgData=e.target.result; step='ia-load'; renderNueva(); analizarIA(); };
  r.readAsDataURL(file); input.value='';
}

async function analizarIA() {
  try {
    const b64 = imgData.split(',')[1];
    const mt  = imgData.split(';')[0].replace('data:','');
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:1500,
        messages:[{ role:"user", content:[
          { type:"image", source:{ type:"base64", media_type:mt, data:b64 }},
          { type:"text",  text:`Analiza esta imagen de factura o boleta de compra para restaurante. Extrae TODOS los productos con su cantidad y precio unitario NETO (sin IVA). Si el precio incluye IVA, divídelo por 1.19. Responde SOLO JSON sin backticks ni texto adicional:\n{"items":[{"nombre":"NOMBRE_EXACTO_FACTURA","qty":1,"pu":1000}]}` }
        ]}]
      })
    });
    const data = await resp.json();
    const txt  = data.content.map(c => c.text||'').join('');
    const parsed = JSON.parse(txt.replace(/```json|```/g,'').trim());
    iaItems = parsed.items.map(it => {
      const found = lookup(it.nombre);
      const sub2  = found?.[2] || 'General';
      return { ...it, area:found?.[0]||'Sin clasificar', cat:found?.[1]||'Sin clasificar', sub2, ok:!!found, costs:calcCosts(it.pu, it.qty, sub2) };
    });
    step = 'ia-result'; renderNueva();
  } catch(e) {
    document.getElementById('pg-nueva').innerHTML = `
      <div class="err-box"><i class="ti ti-alert-circle"></i> No se pudo leer la imagen. Intenta con mejor iluminación o usa el ingreso manual.<br><small style="opacity:.7">${e.message}</small></div>
      <button class="btn-out" style="justify-content:center" onclick="step='choose';renderNueva()"><i class="ti ti-arrow-left"></i>Volver</button>`;
  }
}

function reclasIA(i, cat) {
  if (!cat) return;
  iaItems[i].cat=cat; iaItems[i].area='Cocina caliente'; iaItems[i].sub2=cat; iaItems[i].ok=true;
  extraCat[iaItems[i].nombre.toLowerCase().trim()] = ['Cocina caliente', cat, cat];
  iaItems[i].costs = calcCosts(iaItems[i].pu, iaItems[i].qty, cat);
  saveExtra(); renderNueva();
}

function guardarIA() {
  const neto  = iaItems.reduce((s,it) => s+it.costs.neto,  0);
  const total = iaItems.reduce((s,it) => s+it.costs.total, 0);
  DB.push({ prov:fProv, fecha:fFecha, totalNeto:neto, totalConImp:total, src:'ia',
    items: iaItems.map(it => ({ nombre:it.nombre, qty:it.qty, pu:it.pu, area:it.area, cat:it.cat, sub2:it.sub2, costs:it.costs })) });
  saveDB(); step='ok'; renderNueva();
}

function hintCat() {
  const n = document.getElementById('mn')?.value || '';
  const p = parseFloat(document.getElementById('mp')?.value) || 0;
  const found = lookup(n);
  const hc = document.getElementById('cat-hint');
  const ht = document.getElementById('tax-hint');
  if (!hc || !ht) return;
  if (found) {
    const tax = getTax(found[2]);
    hc.innerHTML = `<i class="ti ti-check" style="vertical-align:-2px"></i> ${found[0]} → ${found[1]} → ${found[2]}`;
    if (tax.ad>0 && p>0) { const ad=Math.round(p*tax.ad/100); ht.innerHTML=`<i class="ti ti-receipt-tax" style="vertical-align:-2px"></i> +${fmtP(tax.ad)} ${tax.tipo} = ${fmt(ad)} extra por unidad`; }
    else if (tax.ad>0)    { ht.innerHTML=`<i class="ti ti-receipt-tax" style="vertical-align:-2px"></i> Tiene impuesto adicional de ${fmtP(tax.ad)}`; }
    else                  { ht.innerHTML=''; }
  } else {
    hc.innerHTML = n.length>2 ? '<span style="color:#854f0b"><i class="ti ti-question-mark" style="vertical-align:-2px"></i> No en catálogo — se aplicará IVA normal</span>' : '';
    ht.innerHTML = '';
  }
}

function addMan() {
  const n = document.getElementById('mn')?.value.trim();
  const q = parseFloat(document.getElementById('mq')?.value) || 1;
  const p = parseFloat(document.getElementById('mp')?.value) || 0;
  if (!n) { alert('Ingresa el nombre del producto'); return; }
  const found = lookup(n);
  const sub2  = found?.[2] || 'General';
  manItems.push({ nombre:n, qty:q, pu:p, area:found?.[0]||'Sin clasificar', cat:found?.[1]||'Sin clasificar', sub2, costs:calcCosts(p,q,sub2) });
  renderNueva();
}
function delMan(i) { manItems.splice(i,1); renderNueva(); }

function guardarMan() {
  if (!manItems.length) { alert('Agrega al menos un producto'); return; }
  const neto  = manItems.reduce((s,it) => s+it.costs.neto,  0);
  const total = manItems.reduce((s,it) => s+it.costs.total, 0);
  DB.push({ prov:fProv, fecha:fFecha, totalNeto:neto, totalConImp:total, src:'manual', items:[...manItems] });
  saveDB(); step='ok'; renderNueva();
}

    <div class="card cp">
      <div style="display:flex;align-items:flex-end;gap:6px;height:90px;padding-bottom:8px">
        ${wkR.map(([w,v])=>`
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
            <div style="width:100%;background:#1d9e75;border-radius:4px 4px 0 0;height:${Math.round(v/maxW*70)}px;min-height:4px"></div>
            <div style="font-size:10px;color:#999;text-align:center;line-height:1.2">${w}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="slbl">Por categoría</div>
    <div class="card cp">
      ${catR.map(([c,v])=>`
        <div class="bar-row">
          <div class="bar-lbl">${c}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxC*100)}%"></div></div>
          <div class="bar-val">${fmt(v)}</div>
        </div>`).join('')}
    </div>
    <div class="slbl">Por área de cocina</div>
    <div class="card">
      ${areaR.map(([a,v])=>`
        <div class="row"><div class="row-info"><div class="row-t">${a}</div></div>
        <div class="row-r"><div class="row-amt">${fmt(v)}</div>
        <div style="font-size:11px;color:#999">${Math.round(v/totAll*100)}%</div></div></div>`).join('')}
    </div>`;
}

/* ── IMPUESTOS ── */
function renderImpuestos() {
  const groups = [
    {key:'general', label:'Impuestos generales'},
    {key:'bebidas', label:'Bebidas y alcohol'},
    {key:'carnes',  label:'Carnes y proteínas'}
  ];
  document.getElementById('pg-impuestos').innerHTML = `
    <div class="info-box"><i class="ti ti-info-circle" style="font-size:16px;flex-shrink:0;margin-top:1px"></i>
    <span>Tasas según SII Chile. Toca una fila para editar. Los cambios se aplican desde la próxima factura.</span></div>
    ${groups.map(g=>`<div class="slbl">${g.label}</div><div class="card" id="tc-${g.key}"></div>`).join('')}`;
  groups.forEach(g => renderTaxGroup(g.key));
}

function renderTaxGroup(gk) {
  const el = document.getElementById('tc-'+gk); if(!el) return;
  el.innerHTML = TAXES[gk].map((t,i) => `
    <div>
      <div class="tax-row-edit" onclick="toggleTax('${gk}',${i})">
        <div class="tax-icon" style="background:${t.ic}"><i class="ti ${t.icon}" style="color:${t.icol}"></i></div>
        <div class="row-info"><div class="row-t">${t.nombre}</div><div class="row-s">${t.desc}</div></div>
        <div style="text-align:right;flex-shrink:0;margin-left:8px">
          <div style="font-weight:500;font-size:15px;color:${t.ad>0?'#a32d2d':'#0f6e56'}">${fmtP(t.iva+t.ad)}</div>
          <div style="font-size:11px;color:#999">${t.tipo}</div>
        </div>
        <i class="ti ti-chevron-down chev" id="chev-${gk}-${i}"></i>
      </div>
      <div class="edit-panel" id="ep-${gk}-${i}">
        <div style="font-size:11px;color:#999;margin-bottom:10px"><i class="ti ti-scale" style="vertical-align:-2px"></i> ${t.nota}</div>
        <div class="rate-row">
          <span class="rate-lbl">IVA base</span>
          <input class="rate-input" type="number" value="${t.iva}" step="0.5" min="0" max="100"
            onchange="updTax('${gk}',${i},'iva',this.value)">
          <span style="font-size:13px;color:#888;margin-left:4px">%</span>
        </div>
        <div class="rate-row">
          <span class="rate-lbl">${t.tipo==='anticipado'?'IVA anticipado':'Imp. adicional'}</span>
          <input class="rate-input" type="number" value="${t.ad}" step="0.5" min="0" max="100"
            onchange="updTax('${gk}',${i},'ad',this.value)">
          <span style="font-size:13px;color:#888;margin-left:4px">%</span>
        </div>
        <div style="background:#fff;border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;font-size:12px;margin-top:4px">
          <span style="color:#666">Carga total</span>
          <span style="font-weight:500" id="tt-${gk}-${i}">${fmtP(t.iva+t.ad)}</span>
        </div>
        <button class="save-mini" onclick="saveTaxes();closeAllTax();alert('✓ Tasas guardadas')">
          <i class="ti ti-check" style="vertical-align:-2px"></i> Guardar cambios
        </button>
      </div>
    </div>`).join('');
}

function toggleTax(gk,i) {
  const ep=document.getElementById(`ep-${gk}-${i}`);
  const ch=document.getElementById(`chev-${gk}-${i}`);
  const open=ep.classList.contains('open');
  closeAllTax();
  if(!open){ep.classList.add('open');ch.style.transform='rotate(180deg)';}
}
function closeAllTax() {
  document.querySelectorAll('.edit-panel').forEach(p=>p.classList.remove('open'));
  document.querySelectorAll('[id^="chev-"]').forEach(c=>c.style.transform='');
}
function updTax(gk,i,field,val) {
  TAXES[gk][i][field]=parseFloat(val)||0;
  const el=document.getElementById(`tt-${gk}-${i}`);
  if(el) el.textContent=fmtP(TAXES[gk][i].iva+TAXES[gk][i].ad);
}

/* ── INICIO ── */
go('home', document.querySelectorAll('.bnav')[0]);
</script>
</body>
</html>
