<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ControlCostos">
<meta name="theme-color" content="#1a6b4a">
<title>ControlCostos · Restaurante v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --g:#1a6b4a;--gl:#e1f5ee;--gd:#0d4a32;
  --r:#a32d2d;--rl:#fcebeb;
  --a:#854f0b;--al:#faeeda;
  --b:#185fa5;--bl:#e6f1fb;
  --bg:#f5f5f0;--card:#fff;--border:#e0e0e0;
  --t1:#1a1a1a;--t2:#444;--t3:#888;--t4:#bbb;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t1);overscroll-behavior:none}
.shell{max-width:480px;margin:0 auto;display:flex;flex-direction:column;height:100dvh;height:100vh}
.topbar{background:#fff;border-bottom:0.5px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:20}
.topbar-left{display:flex;align-items:center;gap:10px}
.back-btn{border:none;background:none;cursor:pointer;color:#666;font-size:20px;padding:2px;display:none;align-items:center}
.tb-title{font-size:16px;font-weight:600}
.tb-sub{font-size:11px;color:var(--t3);margin-top:1px}
.tb-action{border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit}
.scroll{flex:1;overflow-y:auto;padding:12px 12px 90px;-webkit-overflow-scrolling:touch}
.bottomnav{background:#fff;border-top:0.5px solid var(--border);display:flex;position:sticky;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;cursor:pointer;border:none;background:none;color:#999;font-size:9px;font-family:inherit}
.bnav i{font-size:20px}.bnav.on{color:var(--g)}
.page{display:none}.page.on{display:block}
.fab{background:var(--g);color:#fff;border:none;border-radius:14px;padding:0 20px;height:50px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit;width:100%;justify-content:center;margin-bottom:10px}
.fab:active{background:var(--gd)}
.fab-sm{background:var(--g);color:#fff;border:none;border-radius:10px;padding:0 16px;height:42px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;justify-content:center}
.btn-out{width:100%;padding:13px;border-radius:12px;border:0.5px solid var(--border);background:#fff;color:var(--t1);font-size:14px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:8px;text-align:left}
.btn-out i{font-size:20px;color:#888}
.btn-out:active{background:var(--bg)}
.btn-scan{width:100%;padding:14px;border-radius:12px;border:2px solid var(--g);background:var(--gl);color:var(--gd);font-size:14px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:12px;margin-bottom:8px;text-align:left}
.btn-scan i{font-size:22px}
.btn-scan:active{background:#c8edd9}
.card{background:#fff;border-radius:14px;border:0.5px solid var(--border);overflow:hidden;margin-bottom:10px}
.cp{padding:14px}
.slbl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 8px}
.met-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.met{background:var(--bg);border-radius:10px;padding:12px 14px}
.met-l{font-size:11px;color:#666;margin-bottom:4px}
.met-v{font-size:20px;font-weight:600}
.met-s{font-size:11px;color:var(--t3);margin-top:2px}
.row{display:flex;align-items:center;padding:13px 14px;border-bottom:0.5px solid #f0f0f0;gap:10px}
.row:last-child{border-bottom:none}
.row-info{flex:1;min-width:0}
.row-t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:12px;color:var(--t3);margin-top:2px}
.row-r{text-align:right;flex-shrink:0}
.row-amt{font-size:14px;font-weight:600}
.chev{font-size:16px;color:var(--t4);flex-shrink:0}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-lbl{width:76px;flex-shrink:0;font-size:12px;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--g);border-radius:4px}
.bar-val{width:68px;text-align:right;flex-shrink:0;font-weight:600;font-size:12px}
.ff{margin-bottom:12px}
.ff label{font-size:12px;color:#666;display:block;margin-bottom:5px;font-weight:500}
.ff input,.ff select{width:100%;font-size:15px;padding:11px 12px;border:0.5px solid var(--border);border-radius:10px;background:#fff;color:var(--t1);font-family:inherit;-webkit-appearance:none}
.ff input:focus,.ff select:focus{outline:none;border-color:var(--g)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600}
.bg{background:var(--gl);color:var(--gd)}
.ba{background:var(--al);color:var(--a)}
.bb{background:var(--bl);color:var(--b)}
.br{background:var(--rl);color:var(--r)}
.res-item{padding:12px 14px;border-bottom:0.5px solid #f0f0f0}
.res-item:last-child{border-bottom:none}
.res-name{font-size:14px;font-weight:600}
.res-path{font-size:11px;color:var(--t3);margin-top:2px}
.res-bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
.res-price{font-size:14px;font-weight:600}
.tax-pill{font-size:11px;padding:2px 7px;border-radius:8px;background:var(--rl);color:var(--r);margin-top:4px;display:inline-block}
.tax-pill.none{background:var(--gl);color:var(--gd)}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:14px;border-top:0.5px solid #f0f0f0}
.total-lbl{font-size:13px;color:#666}
.total-v{font-size:20px;font-weight:600}
.chip{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px;font-size:13px}
.chip-del{border:none;background:none;color:var(--t4);cursor:pointer;font-size:18px;padding:0 4px}
.hint{font-size:12px;margin:-4px 0 10px;min-height:16px}
.info-box{background:var(--bl);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--b);margin-bottom:10px;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.warn-box{background:var(--al);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--a);margin-bottom:10px;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.ok-box{background:var(--gl);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--gd);margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.danger-box{background:var(--rl);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--r);margin-bottom:10px;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.empty{text-align:center;padding:48px 16px}
.empty i{font-size:44px;color:var(--t4);display:block;margin-bottom:12px}
.empty p{font-size:14px;color:var(--t3);margin-bottom:16px}
.ocr-box{background:#fff;border-radius:14px;border:0.5px solid var(--border);padding:20px;margin-bottom:10px;text-align:center}
.ocr-icon{font-size:40px;color:var(--g);display:block;margin-bottom:12px}
.ocr-msg{font-size:14px;font-weight:600;margin-bottom:8px}
.ocr-sub{font-size:12px;color:var(--t3);margin-bottom:14px}
.ocr-bar-track{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden;margin:0 20px}
.ocr-bar-fill{height:100%;background:var(--g);border-radius:3px;transition:width 0.3s}
.ocr-pct{font-size:11px;color:var(--t3);margin-top:6px}
.edit-item{padding:10px 14px;border-bottom:0.5px solid #f0f0f0;background:#fff}
.edit-item:last-child{border-bottom:none}
.edit-row{display:flex;gap:6px;margin-top:6px}
.edit-inp{flex:1;font-size:13px;padding:6px 8px;border:0.5px solid var(--border);border-radius:7px;background:#fff;color:var(--t1);font-family:inherit}
.edit-inp:focus{outline:none;border-color:var(--g)}
.tax-row-edit{display:flex;align-items:center;padding:12px 14px;border-bottom:0.5px solid #f0f0f0;gap:10px;cursor:pointer}
.tax-row-edit:last-child{border-bottom:none}
.tax-icon-box{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.edit-panel{background:var(--bg);padding:12px 14px;border-bottom:0.5px solid #f0f0f0;display:none}
.edit-panel.open{display:block}
.rate-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rate-lbl{font-size:12px;color:#666;width:130px;flex-shrink:0}
.rate-input{font-size:14px;padding:7px 10px;border:0.5px solid var(--border);border-radius:8px;background:#fff;color:var(--t1);font-family:inherit;width:80px;text-align:right}
.rate-input:focus{outline:none;border-color:var(--g)}
.save-mini{background:var(--g);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:6px;width:100%}
/* Centro de costos */
.pe-ring{width:120px;height:120px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.pe-ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg)}
.pe-inner{text-align:center;position:relative;z-index:1}
.pe-pct{font-size:22px;font-weight:700}
.pe-lbl{font-size:11px;color:var(--t3)}
.cf-item{display:flex;align-items:center;padding:11px 14px;border-bottom:0.5px solid #f0f0f0;gap:10px}
.cf-item:last-child{border-bottom:none}
.cf-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cf-name{flex:1;font-size:13px}
.cf-amt{font-size:13px;font-weight:600}
.cf-del{border:none;background:none;color:var(--t4);cursor:pointer;padding:0 2px;font-size:16px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:12px}
.seg-btn{flex:1;padding:8px 4px;border:none;background:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--t3);transition:all 0.15s}
.seg-btn.on{background:#fff;color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kpi-big{background:var(--g);color:#fff;border-radius:14px;padding:20px;margin-bottom:10px;text-align:center}
.kpi-big .val{font-size:32px;font-weight:700;line-height:1}
.kpi-big .lbl{font-size:12px;opacity:.8;margin-top:6px}
.kpi-big .sub{font-size:13px;opacity:.9;margin-top:4px}
.kpi-warn{background:var(--al);color:var(--a);border-radius:14px;padding:20px;margin-bottom:10px;text-align:center}
.kpi-warn .val{font-size:28px;font-weight:700;line-height:1}
.kpi-warn .lbl{font-size:12px;opacity:.8;margin-top:6px}
.kpi-danger{background:var(--rl);color:var(--r);border-radius:14px;padding:20px;margin-bottom:10px;text-align:center}
.kpi-danger .val{font-size:28px;font-weight:700;line-height:1}
.kpi-danger .lbl{font-size:12px;margin-top:6px}
.sim-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sim-lbl{font-size:13px;color:#666;flex:1}
.sim-val{font-size:14px;font-weight:600;width:90px;text-align:right}
.range-inp{width:100%;margin:6px 0 2px;accent-color:var(--g)}
.divider{height:0.5px;background:var(--border);margin:14px 0}
/* Tabla costos variables */
.tbl-wrap{overflow-x:auto;margin-bottom:10px}
table.cost-tbl{width:100%;border-collapse:collapse;font-size:12px}
.cost-tbl th{background:var(--bg);padding:8px 10px;text-align:left;font-weight:600;color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.cost-tbl td{padding:9px 10px;border-bottom:0.5px solid #f0f0f0}
.cost-tbl tr:last-child td{border-bottom:none}
.cost-tbl td:last-child{text-align:right;font-weight:600}
/* Escenarios */
.esc-card{border-radius:12px;padding:14px;margin-bottom:8px;border:0.5px solid transparent}
.esc-card.verde{background:#e1f5ee;border-color:#a8dbc7}
.esc-card.amarillo{background:#faeeda;border-color:#e8c78b}
.esc-card.rojo{background:#fcebeb;border-color:#e8a8a8}
.esc-title{font-size:13px;font-weight:700;margin-bottom:4px}
.esc-row{display:flex;justify-content:space-between;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" id="back-btn" onclick="goBack()"><i class="ti ti-arrow-left"></i></button>
      <div><div class="tb-title" id="tb-title">Resumen</div><div class="tb-sub" id="tb-sub">Control de costos</div></div>
    </div>
    <button class="tb-action" id="tb-act" style="display:none"></button>
  </div>
  <div class="scroll" id="scroll">
    <div class="page on" id="pg-home"></div>
    <div class="page"    id="pg-facturas"></div>
    <div class="page"    id="pg-nueva"></div>
    <div class="page"    id="pg-pe"></div>
    <div class="page"    id="pg-impuestos"></div>
  </div>
  <nav class="bottomnav">
    <button class="bnav on"  onclick="go('home',this)"><i class="ti ti-home"></i>Inicio</button>
    <button class="bnav"     onclick="go('facturas',this)"><i class="ti ti-file-invoice"></i>Facturas</button>
    <button class="bnav"     onclick="go('nueva',this)"><i class="ti ti-plus"></i>Nueva</button>
    <button class="bnav"     onclick="go('pe',this)"><i class="ti ti-chart-line"></i>Proyección</button>
    <button class="bnav"     onclick="go('impuestos',this)"><i class="ti ti-receipt-tax"></i>Impuestos</button>
  </nav>
</div>
<input type="file" id="file-cam" accept="image/*" capture="environment" style="display:none" onchange="onFile(this)">
<input type="file" id="file-gal" accept="image/*" style="display:none" onchange="onFile(this)">

<script>

function lookup(name){
  const k = name.toLowerCase().trim()
    .replace(/\b(cal\.?\s*\d+|t\/\d+|n[°º]\s*\d+|talla\s*\w+)\b/g,'')
    .replace(/\d+[.,]?\d*\s*(kg|kgs|gr?|g\b|lt?s?|cc|ml|un|und|pzas?|piezas?|caja|cj|bolsa)\b/gi,'')
    .replace(/\bcj\s*x?\s*\d+\s*\w+/gi,'')   // "CJ X 8 KG", "CJ X 36 UN"
    .replace(/\b(grande|chico|mediano|premium|selecto|extra|super|mini|x\d+|sin\s+hueso|s\/h|c\/h|fresc[ao]|congelad[ao]|integr\w*|blanco|entero|entera)\b/gi,'')
    .replace(/^\d{1,3}\s+/,'')
    .replace(/\b\d{5,}\b/g,'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s{2,}/g,' ').trim();

  if(CAT[k]) return CAT[k];
  if(extraCat[k]) return extraCat[k];

  const normKey = ek => ek.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  for(const ek of Object.keys({...CAT,...extraCat})){
    const nk = normKey(ek);
    if(k===nk || k.includes(nk) || nk.includes(k)) return CAT[ek]||extraCat[ek];
  }

  const words = k.split(' ').filter(w=>w.length>3);
  for(const w of words){
    for(const ek of Object.keys({...CAT,...extraCat})){
      const nk = normKey(ek);
      if(nk===w || nk.startsWith(w) || w.startsWith(nk)) return CAT[ek]||extraCat[ek];
    }
  }
  return null;
}
function getTax(subcat){
  for(const g of Object.values(TAXES))
    for(const t of g)
      if(t.cats&&t.cats.includes(subcat)) return t;
  return TAXES.general[0];
}
function calcCosts(pu,qty,subcat){
  const tax=getTax(subcat), neto=Math.round(pu*qty);
  const ivaA=Math.round(neto*tax.iva/100), adA=Math.round(neto*tax.ad/100);
  return{neto,ivaAmt:ivaA,adAmt:adA,total:neto+ivaA+adA,tax};
}

function fmtP(n) { return n%1===0?n+'%':n.toFixed(1)+'%'; }

/* ══════════════════════════════════════════════════════════════
   parseOCRText v3 — Parser optimizado para facturas chilenas
   
   Soporta layouts de:
   - Norte Limpio (CODIGO|CANT|DETALLE|P.UNITARIO|DSCTO|TOTAL)
   - Bombo SPA (Artículo|Cantidad|P.Unitario|Total)
   - ICB Food Service (CODIGO|CANT|UNID|DESCRIPCION ITEM|%DSCTOS|PRECIO|VALOR)
   - Bredenmaster (CODIGO|DESCRIPCION|UM|CANTIDAD|P.UNITARIO|TOTAL)
   - Layouts genéricos de proveedores chilenos
   ══════════════════════════════════════════════════════════════ */
function parseOCRText(rawText){

  /* ── 1. NORMALIZACIÓN AGRESIVA PARA FACTURAS CHILENAS ── */
  const normalize = s => s
    .replace(/\r/g,'')
    .replace(/\t/g,'   ')
    .replace(/[|¡§]/g,' ')
    // OCR confunde O↔0, l/I↔1 entre dígitos
    .replace(/(?<=\d)[oO](?=\d)/g,'0')
    .replace(/(?<=\d)[lI](?=\d)/g,'1')
    // Puntuación OCR común: §, ¶, º confundidos
    .replace(/[§¶°]/g,' ')
    // Líneas de guiones (separadores de tabla)
    .replace(/[-_=]{4,}/g,' ');

  const text    = normalize(rawText);
  const allLines = text.split('\n');

  /* ── 2. PATRONES ESPECÍFICOS FACTURAS CHILENAS ── */

  // Encabezados de descripción (todos los que aparecen en facturas reales CL)
  const HEADER_DESC_RX = /\b(descrip\w*|articul\w*|art[ií]culo\w*|item\w*|[ií]tem\w*|detalle\w*|producto\w*|nombre\w*|concepto\w*|mercader\w*|glosa\w*|descripcion\s+item)\b/i;
  const HEADER_QTY_RX  = /\b(cant\.?\w*|qty\w*|unid\.?\w*|bultos?|kilos?|kg\b|cantidad)\b/i;
  const HEADER_PRICE_RX = /\b(precio\w*|valor\w*|p\.?\s*unit\w*|p\.?\s*neto\w*|monto\w*|importe\w*|p\.unitario|total\b)\b/i;

  // Ruido total (líneas que NUNCA son productos)
  const NOISE_RX = /^(rut\b|giro\b|direcci[oó]n?\b|fono\b|tel[eé]f?\w*|email|@|www\.|n[°ºo]?\s*\d|folio\b|fecha\b|hora\b|caja\b|vendedor|cajero|turno|subtotal\b|sub[\s\-]?total|neto\b|iva\b|19\s*%|exento|total\b|descuento\w*|recargo|vuelto|efectivo|tarjeta|d[eé]bito|cr[eé]dito|propina|gracias|atendido|sucursal|local\b|p[aá]gina\b|hoja\b|observaci|condicion|vencimiento|iaba|cancelado|son:|ciento|doscient|trescient|cuatrocient|quinient|seiscient|seis|siete\s*mil|ocho\s*mil|nueve\s*mil|timbre|res\.\s*\d|verifique|s\.i\.i\.|rut\s*cliente|fecha\s*emis|forma\s*de\s*pago|cond\.\s*pago|doc\.\s*interno|ref\.\s*cliente|nota\s*dir|control\b|vendedor|ref\b|o\.c\.n|n\.p\.g|vend)/i;

  // Códigos internos de proveedor (ej: 15225202, 1039153C1, 105154330, 90302281)
  const CODE_RX = /^[0-9A-Z]{6,12}[A-Z0-9]?\s/;

  // Unidades de factura chilena
  const UNIT_RX = /\b(c60|c100|c120|cj\b|kg\b|lt\b|un\b|und\b|unid\b|paq\b|bol\b|bsa\b|bls\b|caja\b|bandeja\b|saco\b|tarro\b|lata\b|pack\b)\b/i;

  // Números que parecen precios chilenos
  const PRICE_RX = /^\$?(\d{1,3}(?:[.,]\d{3})+|\d{4,7})([.,]\d{1,2})?$/;
  const QTY_RX   = /^(\d{1,3})([.,]\d{1,3})?$/;

  /* ── 3. DETECTAR ZONA DE PRODUCTOS ── */
  let headerLineIdx = -1;
  let descColPos    = 0;
  let qtyColPos     = -1;
  let priceColPos   = -1;
  let codeColExists = false;

  for(let i=0; i<allLines.length; i++){
    const line = allLines[i];
    const low  = line.toLowerCase();
    if(HEADER_DESC_RX.test(low)){
      headerLineIdx = i;
      descColPos  = Math.max(0, low.search(HEADER_DESC_RX));
      qtyColPos   = low.search(HEADER_QTY_RX);
      priceColPos = low.search(HEADER_PRICE_RX);
      // Detectar si hay columna de código al inicio (típico en Bredenmaster, ICB)
      codeColExists = /^(cod[ií]?g?\w*)\s/i.test(low.trim());
      break;
    }
  }

  /* ── 4. RANGO DE LÍNEAS A PARSEAR ── */
  const startLine = headerLineIdx >= 0 ? headerLineIdx + 1 : 0;
  const END_RX = /\b(subtotal\b|sub[\s\-]?total\b|neto\b|iva\b|exento\b|suma\b|gran\s*total\b|cancelado\b|son:\b)/i;
  let endLine = allLines.length;
  for(let i=startLine; i<allLines.length; i++){
    if(END_RX.test(allLines[i]) && !/descrip|articul|item|product/i.test(allLines[i])){
      endLine = i; break;
    }
  }
  const productLines = allLines.slice(startLine, endLine);

  /* ── 5. TOKENIZADOR ── */
  function tokenize(line){
    const tokens=[];let m;const rx=/\S+/g;
    while((m=rx.exec(line))!==null) tokens.push({text:m[0],pos:m.index});
    return tokens;
  }
  function parseNum(s){ return parseFloat(s.replace(/\$/g,'').replace(/\./g,'').replace(',','.')); }
  function isPrice(s){ return PRICE_RX.test(s.replace(/\s/g,'')); }
  function isQty(s)  { return QTY_RX.test(s.replace(/\s/g,'')); }
  function isUnit(s) { return UNIT_RX.test(s); }
  function isNoise(line){ return NOISE_RX.test(line.trim()); }
  function isGarbage(s){ return /^[_\-=*#+\\\/]{2,}$/.test(s)||/^[^a-zA-Z0-9áéíóúñÁÉÍÓÚÑ]{3,}$/.test(s); }
  function isCode(s){ return /^[0-9A-Z]{6,12}$/.test(s); }

  /* ── 6. LIMPIAR NOMBRE ── */
  function cleanName(raw){
    return raw
      // Quitar códigos internos largos (6+ alfanumérico)
      .replace(/\b[A-Z0-9]{6,}\b/g,' ')
      // Quitar especificaciones de pack: "6PFX4", "12x1", "CJ X 8 KG", etc.
      .replace(/\b\d+pfx\d+\b/gi,' ')
      .replace(/\b\d+x\d+\s*(lt?|kg|gr?|ml|un|und)?\b/gi,' ')
      .replace(/\bcj\s*x?\s*\d+\s*\w{0,4}\b/gi,' ')
      // Quitar marcas de cantidad: "LAT350", "LATA 350CC", "350CC"
      .replace(/\b(lat-?\d+|lata\s*\d+\s*cc|\d+\s*cc)\b/gi,' ')
      // Quitar unidades sueltas
      .replace(/\b(kg|gr?|lt?s?|cc|ml|un|und|pza|piezas?|cj|bol|paq|tarro)\b/gi,' ')
      // Quitar números sueltos al final (códigos, tallas, pesos)
      .replace(/\s\d+\s*$/, '')
      .replace(/\s\d+[a-z]\s/gi,' ')
      // Quitar símbolos OCR residuales
      .replace(/[_=*#+\\]{1,}/g,' ')
      .replace(/\s{2,}/g,' ')
      .trim();
  }

  /* ── 7. PARSEAR LÍNEAS ── */
  const items = [];

  for(const rawLine of productLines){
    const line = rawLine.trim();
    if(!line || line.length < 3) continue;
    if(isNoise(line)) continue;
    if(isGarbage(line)) continue;
    if(/^\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}/.test(line)) continue;
    if(/^[\d\s.,]+$/.test(line) && line.replace(/[\s.,]/g,'').length > 5) continue;
    // Saltar líneas que son solo el código interno (sin texto de producto)
    if(/^[0-9A-Z]{6,12}\s*$/.test(line)) continue;

    const tokens = tokenize(line);
    if(!tokens.length) continue;

    /* Separar tokens */
    const numTokens  = tokens.filter(t => isPrice(t.text) || isQty(t.text));
    const textTokens = tokens.filter(t => !isPrice(t.text) && /[a-zA-ZáéíóúñÁÉÍÓÚÑ]/.test(t.text) && !isUnit(t.text));

    if(!textTokens.length) continue;

    /* ── Filtrar tokens de código al inicio ── */
    // Si el primer token es un código interno, saltar
    let nameTokens = textTokens.filter(t => !isCode(t.text));
    if(!nameTokens.length) nameTokens = textTokens;

    /* ── Construir nombre usando posición de columna ── */
    if(descColPos >= 0 && nameTokens.length > 1){
      const rightBound = priceColPos > 0 ? priceColPos : 9999;
      const inDesc = nameTokens.filter(t => t.pos >= descColPos && t.pos < rightBound);
      if(inDesc.length) nameTokens = inDesc;
    }

    let rawNombre = nameTokens.map(t=>t.text).join(' ');
    let nombre = cleanName(rawNombre);

    if(nombre.length < 3) continue;
    if(/^\d+$/.test(nombre)) continue;
    // Ignorar si el "nombre" es solo una unidad
    if(isUnit(nombre.trim())) continue;

    /* ── Extraer cantidad ── */
    let qty = 1;
    // 1. Buscar el primer número pequeño del inicio de línea (patrón más común en facturas CL)
    const firstTok = tokens[0];
    if(isQty(firstTok.text) && !isPrice(firstTok.text) && isCode(tokens[1]?.text || '')){
      // Patrón: CANT CODIGO DESCRIPCION (Bredenmaster, ICB)
      qty = Math.round(parseNum(firstTok.text));
    } else if(isQty(firstTok.text) && !isPrice(firstTok.text)){
      const n = parseNum(firstTok.text);
      if(n >= 1 && n <= 999 && !isCode(firstTok.text)) qty = Math.round(n);
    }
    // 2. Buscar patrón "Cantidad" en el nombre
    const qm = nombre.match(/^(\d{1,3})\s+(.{3,})/);
    if(qm){ const c=parseNum(qm[1]); if(c>=1&&c<=999){qty=Math.round(c);nombre=qm[2].trim();} }

    /* ── Extraer precio ── */
    let pu = 0;
    const priceNums = numTokens
      .filter(t => isPrice(t.text))
      .map(t => parseNum(t.text))
      .filter(n => n >= 100 && n <= 9_999_999);

    if(priceNums.length){
      priceNums.sort((a,b)=>a-b);
      if(priceNums.length === 1){
        pu = priceNums[0];
        // Si qty>1 y parece total, dividir
        if(qty>1){
          const candidate = Math.round(pu/qty);
          // Solo dividir si da precio razonable (>100)
          if(candidate >= 100) pu = candidate;
        }
      } else {
        const min=priceNums[0], max=priceNums[priceNums.length-1];
        // Heurística: si max ≈ min*qty → min es precio unitario
        if(qty>1 && Math.abs(max - min*qty) < max*0.08){
          pu = min;
        } else {
          // El penúltimo suele ser precio unitario (el último es total línea)
          pu = priceNums.length>=2 ? priceNums[priceNums.length-2] : min;
        }
      }
    }
    if(pu === 0) continue;

    /* ── Limpiar nombre final ── */
    nombre = nombre
      .replace(/^\W+|\W+$/g,'')
      .replace(/\s{2,}/g,' ')
      .trim();
    // Capitalizar
    nombre = nombre.split(' ').map(w=>{
      if(w.length<=2) return w.toUpperCase();
      return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
    }).join(' ');

    if(nombre.length<3) continue;

    /* ── Clasificar ── */
    const found = lookup(nombre);
    const sub2  = found?.[2]||'General';
    items.push({nombre,qty,pu,area:found?.[0]||'Sin clasificar',cat:found?.[1]||'Sin clasificar',sub2,ok:!!found,costs:calcCosts(pu,qty,sub2)});
  }

  /* ── 8. DEDUPLICAR ── */
  const seen=new Set();
  const deduped=items.filter(it=>{
    const k=it.nombre.toLowerCase().replace(/\s/g,'').slice(0,10);
    if(seen.has(k))return false;
    seen.add(k);return true;
  });

  if(!deduped.length) return parseOCRFallback(rawText);
  return deduped;
}

/* ════════════════════════════════════════════════════════
   parseOCRFallback — línea por línea cuando falla la tabla
   ════════════════════════════════════════════════════════ */
function parseOCRFallback(text){
  const SKIP=/^(rut|giro|direcci|fono|tel|email|@|neto|iva|total|subtotal|descuento|boleta|factura|ticket|fecha|hora|caja|vendedor|gracias|vuelto|efectivo|tarjeta|debito|credito|propina|n[°º]\s*\d|cancelado|son:|ciento|doscient|trescient|s\.i\.i|timbre|iaba|condicion|vencimiento)/i;
  const items=[];
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>3);
  for(const line of lines){
    if(SKIP.test(line))continue;
    if(/^\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}/.test(line))continue;
    if(/^[-=_]{3,}/.test(line))continue;
    const priceRx=/\$?\s*(\d{1,3}(?:[.,]\d{3})+|\d{4,7})(?:[.,]\d{1,2})?/g;
    const prices=[];let m;
    while((m=priceRx.exec(line))!==null){const n=parseInt(m[1].replace(/[.,]/g,''));if(n>=200&&n<=9999999)prices.push(n);}
    if(!prices.length)continue;
    const pu=prices[prices.length-1];
    let nombre=line
      .replace(/\$?\s*\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})?\s*/g,' ')
      .replace(/\d+\s*(kg|gr?|lt?|cc|un|und|cj)/gi,' ')
      .replace(/[_=*#+|\\]{2,}/g,' ')
      .replace(/\s+/g,' ').trim();
    if(nombre.length<3||/^\d+$/.test(nombre))continue;
    let qty=1;
    const qm=nombre.match(/^(\d+)\s+(.+)/);
    if(qm&&parseInt(qm[1])<=99){qty=parseInt(qm[1]);nombre=qm[2];}
    nombre=nombre.replace(/^\W+|\W+$/g,'').trim();
    if(nombre.length<3)continue;
    nombre=nombre.charAt(0).toUpperCase()+nombre.slice(1).toLowerCase();
    const found=lookup(nombre);const sub2=found?.[2]||'General';
    items.push({nombre,qty,pu,area:found?.[0]||'Sin clasificar',cat:found?.[1]||'Sin clasificar',sub2,ok:!!found,costs:calcCosts(pu,qty,sub2)});
  }
  const seen=new Set();
  return items.filter(it=>{const k=it.nombre.toLowerCase().slice(0,8);if(seen.has(k))return false;seen.add(k);return true;});
}

  const[t,s]=META[page]||['',''];
  document.getElementById('tb-title').textContent=t;
  document.getElementById('tb-sub').textContent=s;
  document.getElementById('back-btn').style.display='none';
  document.getElementById('tb-act').style.display='none';
  if(page==='home')renderHome();
  else if(page==='facturas')renderFacturas();
  else if(page==='nueva'){step='choose';manItems=[];scanItems=[];fProv='';fFecha=todayStr();renderNueva();}
  else if(page==='pe')renderPE();
  else if(page==='impuestos')renderImpuestos();
}
function showBack(from){prevPage=from;document.getElementById('back-btn').style.display='flex';}
function goBack(){if(prevPage){const idx=['home','facturas','nueva','pe','impuestos'].indexOf(prevPage);go(prevPage,document.querySelectorAll('.bnav')[idx]);prevPage=null;}}

function renderHome(){
  const total=DB.reduce((s,f)=>s+f.totalConImp,0);
  const neto=DB.reduce((s,f)=>s+f.totalNeto,0);
  const impTot=total-neto;
  const now=new Date();
  const week=DB.filter(f=>(now-new Date(f.fecha))<7*864e5).reduce((s,f)=>s+f.totalConImp,0);
  const mes=DB.filter(f=>{const d=new Date(f.fecha);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}).reduce((s,f)=>s+f.totalConImp,0);
  const catT={};
  DB.forEach(f=>f.items.forEach(it=>{const c=it.cat||'Sin cat';catT[c]=(catT[c]||0)+it.costs.total;}));
  const top=Object.entries(catT).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const max=top[0]?.[1]||1;

  // Calcular ratio costo/venta si hay venta configurada
  const ventaM=PE.ventaMensual||0;
  const pctCosto=ventaM>0?Math.min(Math.round(mes/ventaM*100),999):null;
  const pctOk=pctCosto!==null&&pctCosto<=(100-PE.margenBruto);

  document.getElementById('pg-home').innerHTML=`
    ${ventaM>0&&pctCosto!==null?`
    <div class="${pctOk?'ok-box':'warn-box'}" style="align-items:center">
      <i class="ti ti-${pctOk?'check':'alert-triangle'}" style="font-size:16px;flex-shrink:0"></i>
      <span>Costo del mes: <b>${pctCosto}%</b> de las ventas
      ${pctOk?'· dentro del objetivo':'· supera el margen objetivo de '+(100-PE.margenBruto)+'%'}
      </span>
    </div>`:''}
    <div class="met-row">
      <div class="met"><div class="met-l">Gasto total</div><div class="met-v">${fmt(total)}</div><div class="met-s">Neto: ${fmt(neto)}</div></div>
      <div class="met"><div class="met-l">Este mes</div><div class="met-v">${fmt(mes)}</div></div>
    </div>
    <div class="met-row">
      <div class="met"><div class="met-l">Facturas</div><div class="met-v">${DB.length}</div></div>
      <div class="met"><div class="met-l">Impuestos</div><div class="met-v" style="color:var(--r)">${fmt(impTot)}</div></div>
    </div>
    <button class="fab" onclick="go('nueva',document.querySelectorAll('.bnav')[2])"><i class="ti ti-plus"></i>Ingresar nueva factura</button>
    <div class="slbl">Top categorías</div>
    <div class="card cp">
      ${top.length?top.map(([c,v])=>`<div class="bar-row"><div class="bar-lbl">${c}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/max*100)}%"></div></div><div class="bar-val">${fmt(v)}</div></div>`).join('')
        :'<div style="text-align:center;padding:20px;font-size:13px;color:#999">Sin datos — ingresa tu primera factura</div>'}
    </div>
    <div class="slbl">Últimas facturas</div>
    <div class="card">
      ${DB.length?DB.slice(-5).reverse().map((f,i)=>`
        <div class="row" onclick="verFactura(${DB.length-1-i},'home')" style="cursor:pointer">
          <div style="width:8px;height:8px;border-radius:50%;background:var(--g);flex-shrink:0"></div>
          <div class="row-info"><div class="row-t">${f.prov}</div><div class="row-s">${f.fecha} · ${f.items.length} productos</div></div>
          <div class="row-r"><div class="row-amt">${fmt(f.totalConImp)}</div></div>
          <i class="ti ti-chevron-right chev"></i>
        </div>`).join(''):'<div style="text-align:center;padding:24px;font-size:13px;color:#999">Sin facturas aún</div>'}
    </div>`;
}

        <option>Proteínas</option><option>Verduras</option><option>Frutas</option><option>Lácteos</option>

      </select>`:''}

function updateScan(i,field,val){
  if(field==='qty') scanItems[i].qty=parseFloat(val)||1;
  else if(field==='pu') scanItems[i].pu=parseFloat(val)||0;
  else if(field==='nombre'){
    scanItems[i].nombre=val;
    const found=lookup(val);
    if(found){scanItems[i].area=found[0];scanItems[i].cat=found[1];scanItems[i].sub2=found[2];scanItems[i].ok=true;}
  }
  scanItems[i].costs=calcCosts(scanItems[i].pu,scanItems[i].qty,scanItems[i].sub2);
  const list=document.getElementById('scan-list');
  if(list) list.innerHTML=renderScanItems()+`<div class="total-row">
    <div><div class="total-lbl">Total c/impuestos</div>
    <div style="font-size:11px;color:#999">Neto: ${fmt(scanItems.reduce((s,it)=>s+it.costs.neto,0))} · Imp: ${fmt(scanItems.reduce((s,it)=>s+it.costs.adAmt+it.costs.ivaAmt,0))}</div></div>
    <div class="total-v">${fmt(scanItems.reduce((s,it)=>s+it.costs.total,0))}</div>
  </div>`;
}
function delScan(i){scanItems.splice(i,1);if(!scanItems.length){step='choose';}renderNueva();}
function reclasificar(i,cat){
  if(!cat)return;
  scanItems[i].cat=cat;scanItems[i].area='Sin clasificar';scanItems[i].sub2=cat;scanItems[i].ok=true;
  extraCat[scanItems[i].nombre.toLowerCase().trim()]=['Sin clasificar',cat,cat];
  scanItems[i].costs=calcCosts(scanItems[i].pu,scanItems[i].qty,cat);
  saveExtra();renderNueva();
}

/* ════════════════════════════════
   OCR con Tesseract
   ════════════════════════════════ */
function chkProv(){
  const p=document.getElementById('np')?.value||fProv;
  if(!p.trim()){alert('Ingresa el nombre del proveedor primero');return false;}
  fProv=p;fFecha=document.getElementById('nf')?.value||fFecha;return true;
}
function doScan(src){ if(!chkProv())return; document.getElementById(src==='cam'?'file-cam':'file-gal').click(); }
function startMan(){ if(!chkProv())return; step='manual'; renderNueva(); }
function onFile(input){
  const file=input.files[0];if(!file)return;
  step='scanning';renderNueva();
  const url=URL.createObjectURL(file);
  Tesseract.recognize(url,'spa',{
    logger:m=>{
      if(m.status==='recognizing text'){
        const pct=Math.round(m.progress*100);
        const bar=document.getElementById('ocr-bar');
        const lbl=document.getElementById('ocr-pct');
        if(bar)bar.style.width=pct+'%';
        if(lbl)lbl.textContent=pct+'%';
      }
    }
  }).then(({data:{text}})=>{
    URL.revokeObjectURL(url);
    window._lastOCRText=text;
    scanItems=parseOCRText(text);
    step=scanItems.length?'scan-preview':'ocr-debug';
    if(!scanItems.length) window._ocrDebugText=text;
    renderNueva();
  }).catch(()=>{
    step='choose';renderNueva();
    alert('Error al leer la imagen. Intenta con mejor iluminación o usa ingreso manual.');
  });
  input.value='';
}
function guardarScan(){
  if(!scanItems.length){alert('No hay productos');return;}
  const neto=scanItems.reduce((s,it)=>s+it.costs.neto,0);
  const total=scanItems.reduce((s,it)=>s+it.costs.total,0);
  DB.push({prov:fProv,fecha:fFecha,totalNeto:neto,totalConImp:total,src:'scan',
    items:scanItems.map(it=>({nombre:it.nombre,qty:it.qty,pu:it.pu,area:it.area,cat:it.cat,sub2:it.sub2,costs:it.costs}))});
  saveDB();step='ok';renderNueva();
}
function hintCat(){
  const n=document.getElementById('mn')?.value||'';
  const p=parseFloat(document.getElementById('mp')?.value)||0;
  const found=lookup(n);
  const hc=document.getElementById('cat-hint'),ht=document.getElementById('tax-hint');
  if(!hc||!ht)return;
  if(found){
    const tax=getTax(found[2]);
    hc.innerHTML=`<i class="ti ti-check" style="vertical-align:-2px"></i> ${found[0]} → ${found[1]} → ${found[2]}`;
    if(tax.ad>0&&p>0) ht.innerHTML=`<i class="ti ti-receipt-tax" style="vertical-align:-2px"></i> +${fmtP(tax.ad)} ${tax.tipo} = ${fmt(Math.round(p*tax.ad/100))} extra/unidad`;
    else if(tax.ad>0) ht.innerHTML=`<i class="ti ti-receipt-tax" style="vertical-align:-2px"></i> Imp. adicional de ${fmtP(tax.ad)}`;
    else ht.innerHTML='';
  }else{
    hc.innerHTML=n.length>2?'<span style="color:var(--a)">No en catálogo — IVA normal</span>':'';
    ht.innerHTML='';
  }
}
function addMan(){
  const n=document.getElementById('mn')?.value.trim();
  const q=parseFloat(document.getElementById('mq')?.value)||1;
  const p=parseFloat(document.getElementById('mp')?.value)||0;
  if(!n){alert('Ingresa el nombre del producto');return;}
  const found=lookup(n);const sub2=found?.[2]||'General';
  manItems.push({nombre:n,qty:q,pu:p,area:found?.[0]||'Sin clasificar',cat:found?.[1]||'Sin clasificar',sub2,costs:calcCosts(p,q,sub2)});
  renderNueva();
}
function delMan(i){manItems.splice(i,1);renderNueva();}
function guardarMan(){
  if(!manItems.length){alert('Agrega al menos un producto');return;}
  const neto=manItems.reduce((s,it)=>s+it.costs.neto,0);
  const total=manItems.reduce((s,it)=>s+it.costs.total,0);
  DB.push({prov:fProv,fecha:fFecha,totalNeto:neto,totalConImp:total,src:'manual',items:[...manItems]});
  saveDB();step='ok';renderNueva();
}

/* ════════════════════════════════
   PROYECCIÓN FINANCIERA / PE
   ════════════════════════════════ */
let peTab='config';

function renderPE(){
  const el=document.getElementById('pg-pe');
  const segHtml=`
    <div class="seg">
      <button class="seg-btn ${peTab==='config'?'on':''}" onclick="peTab='config';renderPE()">Configurar</button>
      <button class="seg-btn ${peTab==='pe'?'on':''}" onclick="peTab='pe';renderPE()">Punto Equilibrio</button>
      <button class="seg-btn ${peTab==='sim'?'on':''}" onclick="peTab='sim';renderPE()">Simulador</button>
    </div>`;

  if(peTab==='config'){
    el.innerHTML=segHtml+renderPEConfig();
  } else if(peTab==='pe'){
    el.innerHTML=segHtml+renderPECalc();
  } else {
    el.innerHTML=segHtml+renderPESim();
  }
}

/* ── Config ── */
function renderPEConfig(){
  const cf=PE.cfijos;
  const totalCF=cf.reduce((s,c)=>s+c.monto,0);
  return `
    <div class="slbl">Parámetros del negocio</div>
    <div class="card cp">
      <div class="ff"><label>Venta mensual estimada ($)</label>
        <input type="number" value="${PE.ventaMensual||''}" placeholder="Ej: 5000000" onchange="PE.ventaMensual=parseFloat(this.value)||0;savePE()"></div>
      <div class="ff"><label>Margen bruto objetivo (%)</label>
        <input type="number" value="${PE.margenBruto}" placeholder="35" min="1" max="99" onchange="PE.margenBruto=parseFloat(this.value)||35;savePE()"></div>
      <div class="g2">
        <div class="ff"><label>Días hábiles/mes</label>
          <input type="number" value="${PE.diasMes}" placeholder="26" min="1" max="31" onchange="PE.diasMes=parseInt(this.value)||26;savePE()"></div>
        <div class="ff"><label>Turnos/día</label>
          <input type="number" value="${PE.turnosPorDia}" placeholder="2" min="1" max="5" onchange="PE.turnosPorDia=parseInt(this.value)||2;savePE()"></div>
      </div>
      <div class="g2">
        <div class="ff"><label>Ticket promedio ($)</label>
          <input type="number" value="${PE.ticketPromedio||''}" placeholder="Ej: 8500" onchange="PE.ticketPromedio=parseFloat(this.value)||0;savePE()"></div>
        <div class="ff"><label>Coberturas/turno</label>
          <input type="number" value="${PE.coberturas||''}" placeholder="Ej: 40" onchange="PE.coberturas=parseFloat(this.value)||0;savePE()"></div>
      </div>
    </div>

    <div class="slbl">Costos fijos mensuales</div>
    <div class="info-box"><i class="ti ti-info-circle" style="font-size:16px;flex-shrink:0"></i>
    <span>Arriendos, sueldos, servicios básicos, seguros, licencias — todo lo que pagas aunque no vendas nada.</span></div>
    <div class="card" id="cf-list">
      ${cf.length?cf.map((c,i)=>`
        <div class="cf-item">
          <div class="cf-dot" style="background:${cfColor(i)}"></div>
          <div class="cf-name"><div style="font-weight:500">${c.nombre}</div><div style="font-size:11px;color:var(--t3)">${c.tipo}</div></div>
          <div class="cf-amt">${fmt(c.monto)}</div>
          <button class="cf-del" onclick="delCF(${i})"><i class="ti ti-x"></i></button>
        </div>`).join('')+`
        <div style="display:flex;justify-content:space-between;padding:12px 14px;border-top:0.5px solid #f0f0f0;font-size:13px">
          <span style="color:#666;font-weight:500">Total costos fijos</span>
          <span style="font-weight:700;font-size:15px">${fmt(totalCF)}</span>
        </div>`
      :'<div style="padding:14px;font-size:13px;color:var(--t3);text-align:center">Sin costos fijos configurados</div>'}
    </div>
    <div class="card cp" style="margin-bottom:10px">
      <div style="font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Agregar costo fijo</div>
      <div class="ff" style="margin-bottom:8px"><label>Descripción</label>
        <input id="cf-nom" placeholder="Ej: Arriendo local, Sueldo cocinero..."></div>
      <div class="g2">
        <div class="ff" style="margin:0"><label>Monto mensual ($)</label>
          <input type="number" id="cf-monto" placeholder="0"></div>
        <div class="ff" style="margin:0"><label>Tipo</label>
          <select id="cf-tipo">
            <option>Personal</option><option>Arriendo</option><option>Servicios básicos</option>
            <option>Marketing</option><option>Contabilidad</option><option>Seguros</option><option>Otro</option>
          </select></div>
      </div>
      <button class="fab" style="margin-top:8px;margin-bottom:0;height:42px;font-size:13px" onclick="addCF()">
        <i class="ti ti-plus"></i>Agregar</button>
    </div>`;
}

function cfColor(i){
  const colors=['#1a6b4a','#185fa5','#854f0b','#a32d2d','#6b3fa0','#0d6e6e','#5a6b1a','#6b1a4a'];
  return colors[i%colors.length];
}
function addCF(){
  const n=document.getElementById('cf-nom')?.value.trim();
  const m=parseFloat(document.getElementById('cf-monto')?.value)||0;
  const t=document.getElementById('cf-tipo')?.value||'Otro';
  if(!n||!m){alert('Completa nombre y monto');return;}
  PE.cfijos.push({nombre:n,monto:m,tipo:t});
  savePE();renderPE();
}
function delCF(i){PE.cfijos.splice(i,1);savePE();renderPE();}

/* ── Punto de Equilibrio ── */
function renderPECalc(){
  const cf=PE.cfijos.reduce((s,c)=>s+c.monto,0);
  const mg=PE.margenBruto/100;
  const diasMes=PE.diasMes||26;
  const ticket=PE.ticketPromedio||0;
  const coberturas=PE.coberturas||0;
  const turnos=PE.turnosPorDia||2;

  // Calcular costos variables del último mes desde DB
  const now=new Date();
  const cvMes=DB.filter(f=>{const d=new Date(f.fecha);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}).reduce((s,f)=>s+f.totalNeto,0);
  const ventaM=PE.ventaMensual||0;
  const mgReal=ventaM>0?(1-cvMes/ventaM)*100:null;

  if(!cf){
    return `<div class="danger-box" style="flex-direction:column;align-items:flex-start">
      <div style="display:flex;gap:8px;align-items:center"><i class="ti ti-alert-triangle" style="font-size:18px;flex-shrink:0"></i><b>Configura tus costos fijos primero</b></div>
      <div style="margin-top:6px">Ve a la pestaña "Configurar" e ingresa tus costos fijos mensuales para calcular el punto de equilibrio.</div>
    </div>
    <button class="btn-out" style="justify-content:center" onclick="peTab='config';renderPE()"><i class="ti ti-settings"></i>Ir a configurar</button>`;
  }

  // Punto de equilibrio = CF / Margen bruto
  const peVenta=Math.round(cf/mg);
  const peDiario=Math.round(peVenta/diasMes);
  const peSemanal=Math.round(peVenta/4.33);
  // Coberturas diarias mínimas para PE
  const cobMin=ticket>0?Math.ceil(peDiario/ticket):null;
  // Venta mínima por turno
  const ventaTurno=Math.round(peDiario/turnos);
  const cobTurno=ticket>0?Math.ceil(cobMin/turnos):null;

  // % de cobertura del PE si hay venta configurada
  const pctPE=ventaM>0?Math.min(100,Math.round(ventaM/peVenta*100)):null;

  const ringColor=pctPE!==null?(pctPE>=100?'#1a6b4a':pctPE>=75?'#854f0b':'#a32d2d'):'#1a6b4a';
  const ringPct=pctPE!==null?Math.min(100,pctPE):0;
  const r=44, circ=2*Math.PI*r;
  const dash=circ*(ringPct/100);

  return `
    ${pctPE!==null?`
    <div style="text-align:center;padding:8px 0 4px">
      <div class="pe-ring">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="${r}" fill="none" stroke="#f0f0f0" stroke-width="10"/>
          <circle cx="60" cy="60" r="${r}" fill="none" stroke="${ringColor}" stroke-width="10"
            stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"/>
        </svg>
        <div class="pe-inner">
          <div class="pe-pct" style="color:${ringColor}">${ringPct}%</div>
          <div class="pe-lbl">del PE</div>
        </div>
      </div>
      <div style="font-size:12px;color:var(--t3);margin-bottom:12px">
        ${pctPE>=100?'✅ Tu venta estimada supera el punto de equilibrio':'Venta estimada vs. lo mínimo para no perder'}
      </div>
    </div>`:''}

    <div class="kpi-big">
      <div class="val">${fmt(peVenta)}</div>
      <div class="lbl">Venta mínima mensual para no perder dinero</div>
      <div class="sub">Con ${fmtP(PE.margenBruto)} margen bruto y ${fmt(cf)} en costos fijos</div>
    </div>

    <div class="met-row">
      <div class="met" style="text-align:center">
        <div class="met-l">Venta mínima diaria</div>
        <div class="met-v" style="font-size:18px">${fmt(peDiario)}</div>
        <div class="met-s">${diasMes} días hábiles</div>
      </div>
      <div class="met" style="text-align:center">
        <div class="met-l">Venta mínima semanal</div>
        <div class="met-v" style="font-size:18px">${fmt(peSemanal)}</div>
      </div>
    </div>

    ${turnos>1?`<div class="met-row">
      <div class="met" style="text-align:center">
        <div class="met-l">Por turno (${turnos}/día)</div>
        <div class="met-v" style="font-size:18px">${fmt(ventaTurno)}</div>
      </div>
      ${cobTurno!==null?`<div class="met" style="text-align:center">
        <div class="met-l">Coberturas/turno mínimas</div>
        <div class="met-v" style="font-size:18px">${cobTurno}</div>
        <div class="met-s">ticket ${fmt(ticket)}</div>
      </div>`:''}
    </div>`:''}

    ${cobMin!==null?`<div class="card cp" style="text-align:center">
      <div style="font-size:12px;color:var(--t3);margin-bottom:4px">Coberturas diarias mínimas para equilibrio</div>
      <div style="font-size:36px;font-weight:700;color:var(--g)">${cobMin}</div>
      <div style="font-size:12px;color:var(--t3)">ticket promedio de ${fmt(ticket)}</div>
    </div>`:''}

    <div class="slbl">Composición de costos fijos</div>
    <div class="card">
      ${PE.cfijos.map((c,i)=>`
        <div class="cf-item">
          <div class="cf-dot" style="background:${cfColor(i)}"></div>
          <div class="cf-name"><div style="font-weight:500">${c.nombre}</div><div style="font-size:11px;color:var(--t3)">${c.tipo}</div></div>
          <div>
            <div class="cf-amt">${fmt(c.monto)}</div>
            <div style="font-size:11px;color:var(--t3);text-align:right">${Math.round(c.monto/cf*100)}%</div>
          </div>
        </div>`).join('')}
      <div style="display:flex;justify-content:space-between;padding:12px 14px;border-top:0.5px solid #f0f0f0">
        <span style="font-weight:600">Total CF</span>
        <span style="font-weight:700">${fmt(cf)}</span>
      </div>
    </div>

    ${mgReal!==null?`<div class="slbl">Margen real este mes</div>
    <div class="${mgReal>=PE.margenBruto?'ok-box':'warn-box'}">
      <i class="ti ti-${mgReal>=PE.margenBruto?'trending-up':'trending-down'}" style="font-size:18px;flex-shrink:0"></i>
      <div>Margen bruto real: <b>${mgReal.toFixed(1)}%</b> (objetivo: ${fmtP(PE.margenBruto)})<br>
      Costo variables: ${fmt(cvMes)} sobre venta de ${fmt(ventaM)}</div>
    </div>`:''}

    <div class="slbl">Escenarios</div>
    ${[
      {label:'🟢 Optimista +20%',mult:1.2,cls:'verde'},
      {label:'🟡 Base (equilibrio)',mult:1.0,cls:'amarillo'},
      {label:'🔴 Pesimista -20%',mult:0.8,cls:'rojo'}
    ].map(e=>{
      const v=Math.round(peVenta*e.mult);
      const gan=Math.round(v*mg-cf);
      return `<div class="esc-card ${e.cls}">
        <div class="esc-title">${e.label}</div>
        <div class="esc-row"><span>Venta mensual</span><b>${fmt(v)}</b></div>
        <div class="esc-row"><span>Margen bruto (${fmtP(PE.margenBruto)})</span><b>${fmt(Math.round(v*mg))}</b></div>
        <div class="esc-row"><span>Costos fijos</span><b style="color:var(--r)">-${fmt(cf)}</b></div>
        <div class="esc-row" style="margin-top:4px;padding-top:4px;border-top:0.5px solid rgba(0,0,0,.1)">
          <span style="font-weight:600">Resultado</span>
          <b style="color:${gan>=0?'#1a6b4a':'#a32d2d'}">${gan>=0?'+':''}${fmt(gan)}</b>
        </div>
      </div>`;
    }).join('')}`;
}

/* ── Simulador ── */
function renderPESim(){
  const cf=PE.cfijos.reduce((s,c)=>s+c.monto,0);
  const mg=PE.margenBruto/100;
  if(!cf){
    return`<div class="warn-box"><i class="ti ti-alert-triangle" style="flex-shrink:0"></i>Configura costos fijos primero.</div>
    <button class="btn-out" style="justify-content:center" onclick="peTab='config';renderPE()"><i class="ti ti-settings"></i>Ir a configurar</button>`;
  }
  const simVenta=window._simVenta||PE.ventaMensual||Math.round(cf/mg);
  const simMg=window._simMg!==undefined?window._simMg:PE.margenBruto;
  const ganancia=Math.round(simVenta*(simMg/100)-cf);
  const peDiario=Math.round((cf/(simMg/100))/PE.diasMes);
  const ganDiario=Math.round(ganancia/PE.diasMes);

  return`
    <div class="slbl">Simular venta mensual</div>
    <div class="card cp">
      <div class="sim-row">
        <span class="sim-lbl">Venta mensual</span>
        <span class="sim-val" id="sim-venta-val">${fmt(simVenta)}</span>
      </div>
      <input type="range" class="range-inp" id="sim-venta"
        min="${Math.round(cf/mg*0.3)}" max="${Math.round(cf/mg*3)}"
        step="${Math.round(cf/mg*0.01)}" value="${simVenta}"
        oninput="window._simVenta=parseInt(this.value);renderPESim()">

      <div class="sim-row" style="margin-top:8px">
        <span class="sim-lbl">Margen bruto</span>
        <span class="sim-val" id="sim-mg-val">${simMg}%</span>
      </div>
      <input type="range" class="range-inp" id="sim-mg"
        min="10" max="80" step="1" value="${simMg}"
        oninput="window._simMg=parseInt(this.value);renderPESim()">
    </div>

    <div class="${ganancia>=0?'kpi-big':'kpi-danger'}">
      <div class="val">${ganancia>=0?'+':''}${fmt(ganancia)}</div>
      <div class="lbl">${ganancia>=0?'Ganancia mensual estimada':'Pérdida mensual estimada'}</div>
      <div class="sub">${ganancia>=0?'+'+fmt(ganDiario)+' diario':fmt(Math.abs(ganDiario))+' de pérdida diaria'}</div>
    </div>

    <div class="met-row">
      <div class="met">
        <div class="met-l">Margen bruto generado</div>
        <div class="met-v">${fmt(Math.round(simVenta*(simMg/100)))}</div>
      </div>
      <div class="met">
        <div class="met-l">Costos fijos</div>
        <div class="met-v" style="color:var(--r)">${fmt(cf)}</div>
      </div>
    </div>
    <div class="met-row">
      <div class="met">
        <div class="met-l">PE diario necesario</div>
        <div class="met-v">${fmt(peDiario)}</div>
      </div>
      <div class="met">
        <div class="met-l">Diferencia vs PE</div>
        <div class="met-v" style="color:${simVenta>=Math.round(cf/(simMg/100))?'var(--g)':'var(--r)'}">
          ${simVenta>=Math.round(cf/(simMg/100))?'+':'-'}${fmt(Math.abs(simVenta-Math.round(cf/(simMg/100))))}
        </div>
      </div>
    </div>

    <div class="slbl">¿Qué pasa si subo el ticket promedio?</div>
    <div class="card">
      ${[0.9,1,1.1,1.2,1.3].map(mult=>{
        const t=Math.round((PE.ticketPromedio||5000)*mult);
        const cobNeeded=t>0?Math.ceil(peDiario/t):null;
        const activas=cobNeeded!==null&&PE.coberturas>0?cobNeeded<=PE.coberturas:null;
        return`<div class="cf-item">
          <div style="flex:1">
            <div style="font-size:13px;font-weight:500">Ticket ${fmt(t)}</div>
            ${cobNeeded!==null?`<div style="font-size:11px;color:var(--t3)">${cobNeeded} coberturas/día para PE</div>`:''}
          </div>
          ${activas!==null?`<span class="badge ${activas?'bg':'br'}">${activas?'✓ Alcanzable':'Difícil'}</span>`:''}
        </div>`;
      }).join('')}
    </div>`;
}

/* ════════════════════════════════
   IMPUESTOS
   ════════════════════════════════ */
function renderImpuestos(){
  const groups=[{key:'general',label:'Generales'},{key:'bebidas',label:'Bebidas y alcohol'},{key:'carnes',label:'Carnes y harinas'}];
  document.getElementById('pg-impuestos').innerHTML=`
    <div class="info-box"><i class="ti ti-info-circle" style="font-size:16px;flex-shrink:0"></i>
    <span>Tasas SII Chile vigentes. Toca para editar.</span></div>
    ${groups.map(g=>`<div class="slbl">${g.label}</div><div class="card" id="tc-${g.key}"></div>`).join('')}`;
  groups.forEach(g=>renderTaxGroup(g.key));
}
function renderTaxGroup(gk){
  const el=document.getElementById('tc-'+gk);if(!el)return;
  el.innerHTML=TAXES[gk].map((t,i)=>`
    <div>
      <div class="tax-row-edit" onclick="toggleTax('${gk}',${i})">
        <div class="tax-icon-box" style="background:${t.ic}"><i class="ti ${t.icon}" style="color:${t.icol}"></i></div>
        <div class="row-info"><div class="row-t">${t.nombre}</div><div class="row-s">${t.desc}</div></div>
        <div style="text-align:right;flex-shrink:0;margin-left:8px">
          <div style="font-weight:600;font-size:15px;color:${t.ad>0?'var(--r)':'var(--g)'}">${fmtP(t.iva+t.ad)}</div>
          <div style="font-size:11px;color:var(--t3)">${t.tipo}</div>
        </div>
        <i class="ti ti-chevron-down chev" id="chev-${gk}-${i}"></i>
      </div>
      <div class="edit-panel" id="ep-${gk}-${i}">
        <div style="font-size:11px;color:var(--t3);margin-bottom:10px"><i class="ti ti-scale" style="vertical-align:-2px"></i> ${t.nota}</div>
        <div class="rate-row"><span class="rate-lbl">IVA base</span>
          <input class="rate-input" type="number" value="${t.iva}" step="0.5" min="0" max="100" onchange="updTax('${gk}',${i},'iva',this.value)">
          <span style="font-size:13px;color:var(--t3);margin-left:4px">%</span></div>
        <div class="rate-row"><span class="rate-lbl">${t.tipo==='anticipado'?'IVA anticipado':'Imp. adicional'}</span>
          <input class="rate-input" type="number" value="${t.ad}" step="0.5" min="0" max="100" onchange="updTax('${gk}',${i},'ad',this.value)">
          <span style="font-size:13px;color:var(--t3);margin-left:4px">%</span></div>
        <div style="background:#fff;border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;font-size:12px;margin-top:4px">
          <span style="color:#666">Carga total</span><span style="font-weight:600" id="tt-${gk}-${i}">${fmtP(t.iva+t.ad)}</span>
        </div>
        <button class="save-mini" onclick="saveTaxes();closeAllTax();alert('✓ Tasas guardadas')">
          <i class="ti ti-check" style="vertical-align:-2px"></i> Guardar cambios</button>
      </div>
    </div>`).join('');
}
function toggleTax(gk,i){
  const ep=document.getElementById(`ep-${gk}-${i}`),ch=document.getElementById(`chev-${gk}-${i}`);
  const open=ep.classList.contains('open');closeAllTax();
  if(!open){ep.classList.add('open');ch.style.transform='rotate(180deg)';}
}
function closeAllTax(){
  document.querySelectorAll('.edit-panel').forEach(p=>p.classList.remove('open'));
  document.querySelectorAll('[id^="chev-"]').forEach(c=>c.style.transform='');
}
function updTax(gk,i,field,val){
  TAXES[gk][i][field]=parseFloat(val)||0;
  const el=document.getElementById(`tt-${gk}-${i}`);
  if(el)el.textContent=fmtP(TAXES[gk][i].iva+TAXES[gk][i].ad);
}

go('home',document.querySelectorAll('.bnav')[0]);
</script>
